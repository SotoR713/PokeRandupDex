    // ===================== Utils =====================
    function titleCase(name) {
      return (name || "").replace(/\b\w/g, (c) => c.toUpperCase());
    }
    function getIdFromUrl(url) {
      const m = (url || "").match(/\/pokemon\/(\d+)\/?$/);
      return m ? Number(m[1]) : null;
    }
    function artUrlById(id) {
      return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;
    }
    function fallbackSpriteById(id) {
      return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`;
    }
    // Normalizar: quitar acentos y pasar a minúsculas
    function normalize(s) {
      return (s || "").toString().normalize("NFD").replace(/\p{Diacritic}/gu,"").toLowerCase();
    }
    // Query-string (hash) helpers
    function parseQS(qs) {
      const out = {};
      qs.replace(/^\?/, "").split("&").forEach(p => {
        const [k,v] = p.split("=");
        if (!k) return;
        out[decodeURIComponent(k)] = decodeURIComponent(v ?? "");
      });
      return out;
    }
    function toQS(obj) {
      return "?" + Object.entries(obj)
        .filter(([,v]) => v !== undefined && v !== null && v !== "" )
        .map(([k,v]) => `${encodeURIComponent(k)}=${encodeURIComponent(v)}`).join("&");
    }

    // ===================== Constantes =====================
    const TYPE_COLORS = {
      normal:"#A8A77A", fire:"#EE8130", water:"#6390F0", electric:"#F7D02C", grass:"#7AC74C", ice:"#96D9D6",
      fighting:"#C22E28", poison:"#A33EA1", ground:"#E2BF65", flying:"#A98FF3", psychic:"#F95587",
      bug:"#A6B91A", rock:"#B6A136", ghost:"#735797", dragon:"#6F35FC", dark:"#705746", steel:"#B7B7CE", fairy:"#D685AD",
    };
    const TYPE_ES = {
      normal:"Normal", fire:"Fuego", water:"Agua", electric:"Eléctrico", grass:"Planta", ice:"Hielo",
      fighting:"Lucha", poison:"Veneno", ground:"Tierra", flying:"Volador", psychic:"Psíquico",
      bug:"Bicho", rock:"Roca", ghost:"Fantasma", dragon:"Dragón", dark:"Siniestro", steel:"Acero", fairy:"Hada"
    };
    const ALL_TYPES = Object.keys(TYPE_COLORS);

    // Generaciones por rango de ID
    const GENERATIONS = [
      { key: '1', label: 'Gen I – Kanto (1–151)', range: [1, 151] },
      { key: '2', label: 'Gen II – Johto (152–251)', range: [152, 251] },
      { key: '3', label: 'Gen III – Hoenn (252–386)', range: [252, 386] },
      { key: '4', label: 'Gen IV – Sinnoh (387–493)', range: [387, 493] },
      { key: '5', label: 'Gen V – Teselia (494–649)', range: [494, 649] },
      { key: '6', label: 'Gen VI – Kalos (650–721)', range: [650, 721] },
      { key: '7', label: 'Gen VII – Alola (722–809)', range: [722, 809] },
      { key: '8', label: 'Gen VIII – Galar/Hisui (810–905)', range: [810, 905] },
      { key: '9', label: 'Gen IX – Paldea (906–1025)', range: [906, 1025] },
    ];
    function rangeForGen(genKey) { return GENERATIONS.find(g => g.key === genKey)?.range ?? null; }

    // ===================== Caches =====================
    const POKE_DETAIL_CACHE = new Map();   // id -> {detail}
    const POKE_SPECIES_CACHE = new Map();  // id -> {species}
    const TYPE_POKEMON_CACHE = new Map();  // type -> Set(ids)
    const TYPE_DETAIL_CACHE = new Map();   // type -> type detail
    const MOVE_DETAIL_CACHE = new Map();   // move url -> detail
    const ENCOUNTER_CACHE = new Map();     // id -> encounters

    // ===================== Fetch helpers =====================
    async function getPokemonDetail(idOrUrl) {
      const id = typeof idOrUrl === 'string' && idOrUrl.startsWith('http') ? getIdFromUrl(idOrUrl) : Number(idOrUrl);
      if (POKE_DETAIL_CACHE.has(id)) return POKE_DETAIL_CACHE.get(id);
      const d = await fetch(typeof idOrUrl === 'string' && idOrUrl.startsWith('http') ? idOrUrl : `https://pokeapi.co/api/v2/pokemon/${id}`).then(r => r.json());
      const detail = {
        id: d.id,
        name: d.name,
        image: d.sprites?.other?.["official-artwork"]?.front_default || artUrlById(d.id),
        types: (d.types || []).map((t) => t.type.name),
        abilities: (d.abilities || []).map((a) => a.ability.name),
        bst: (d.stats || []).reduce((acc, s) => acc + (s.base_stat || 0), 0),
        height: d.height,
        weight: d.weight,
        base_experience: d.base_experience,
        stats: (d.stats || []).map((s) => ({ name: s.stat.name, value: s.base_stat })),
        moves: d.moves || []
      };
      POKE_DETAIL_CACHE.set(d.id, detail);
      return detail;
    }
    async function getPokemonSpecies(id) {
      if (POKE_SPECIES_CACHE.has(id)) return POKE_SPECIES_CACHE.get(id);
      const d = await fetch(`https://pokeapi.co/api/v2/pokemon-species/${id}`).then(r => r.json());
      POKE_SPECIES_CACHE.set(id, d);
      return d;
    }
    async function getIdsForType(type) {
      if (TYPE_POKEMON_CACHE.has(type)) return TYPE_POKEMON_CACHE.get(type);
      const d = await fetch(`https://pokeapi.co/api/v2/type/${type}`).then(r => r.json());
      const ids = new Set((d.pokemon || []).map(p => getIdFromUrl(p.pokemon.url)).filter(Boolean));
      TYPE_POKEMON_CACHE.set(type, ids);
      return ids;
    }
    async function getTypeDetail(type) {
      if (TYPE_DETAIL_CACHE.has(type)) return TYPE_DETAIL_CACHE.get(type);
      const d = await fetch(`https://pokeapi.co/api/v2/type/${type}`).then(r => r.json());
      TYPE_DETAIL_CACHE.set(type, d);
      return d;
    }
    async function getMoveDetail(url) {
      if (MOVE_DETAIL_CACHE.has(url)) return MOVE_DETAIL_CACHE.get(url);
      const d = await fetch(url).then(r => r.json());
      const detail = {
        name: d.name,
        type: d.type?.name,
        accuracy: d.accuracy,
        power: d.power,
        damage_class: d.damage_class?.name,
      };
      MOVE_DETAIL_CACHE.set(url, detail);
      return detail;
    }
    async function getEncounters(id) {
      if (ENCOUNTER_CACHE.has(id)) return ENCOUNTER_CACHE.get(id);
      const d = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}/encounters`).then(r => r.json());
      ENCOUNTER_CACHE.set(id, d || []);
      return d || [];
    }

    // ===================== Efectividades =====================
    async function fetchDefenseMultipliers(typeNames) {
      const mult = Object.fromEntries(ALL_TYPES.map((t) => [t, 1]));
      for (const t of typeNames) {
        const data = await getTypeDetail(t);
        const rel = data.damage_relations || {};
        (rel.double_damage_from || []).forEach((x) => (mult[x.name] *= 2));
        (rel.half_damage_from || []).forEach((x) => (mult[x.name] *= 0.5));
        (rel.no_damage_from || []).forEach((x) => (mult[x.name] *= 0));
      }
      return mult;
    }
    async function fetchOffenseMultipliers(typeNames) {
      // En ataque, tomamos el MEJOR multiplicador disponible entre los tipos del Pokémon
      const result = Object.fromEntries(ALL_TYPES.map((t) => [t, 1]));
      for (const t of typeNames) {
        const data = await getTypeDetail(t);
        const rel = data.damage_relations || {};
        const local = Object.fromEntries(ALL_TYPES.map((x)=>[x,1]));
        (rel.double_damage_to || []).forEach((x) => (local[x.name] = 2));
        (rel.half_damage_to || []).forEach((x) => (local[x.name] = 0.5));
        (rel.no_damage_to || []).forEach((x) => (local[x.name] = 0));
        for (const ty of ALL_TYPES) {
          // elegimos el máximo (puedes usar 2 > 1 > 0.5 > 0)
          const current = result[ty];
          const candidate = local[ty];
          const order = {0:0, 0.5:1, 1:2, 2:3};
          result[ty] = order[candidate] > order[current] ? candidate : current;
        }
      }
      return result;
    }

    // ===================== Router (con query en hash) =====================
    function parseRoute(hash) {
      const h = (hash || "").replace(/^#/, "");
      if (h === "" || h === "/") return { name: "home", qs: {} };
      const m = h.match(/^\/?pokemon\/(\d+)\/?$/);
      if (m) return { name: "pokemon", id: Number(m[1]), qs: {} };
      const qm = h.match(/^\/?\?(.*)$/);
      if (qm) return { name: "home", qs: parseQS(qm[1] || "") };
      return { name: "home", qs: {} };
    }
    function buildHomeHash(qsObj) { return "#/" + toQS(qsObj); }

    // ===================== UI helpers =====================
    function TypeBadge({ type, label, lang="es" }) {
      const color = TYPE_COLORS[type] || "#999";
      const mapLabel = lang === "es" ? (TYPE_ES[type] ?? titleCase(type)) : titleCase(type);
      return (
        <span
          className="px-2 py-0.5 text-xs rounded-full text-white shadow whitespace-nowrap"
          style={{ backgroundColor: color }}
        >
          {label ?? mapLabel}
        </span>
      );
    }

    // ===================== App raíz =====================
    function PokeRandupApp() {
      const [route, setRoute] = useState(() => parseRoute(window.location.hash));
      const [lang, setLang] = useState(() => {
        try { return localStorage.getItem("pokerandup_lang") || "es"; } catch { return "es"; }
      });
      const [theme, setTheme] = useState(() => {
        try { return localStorage.getItem("pokerandup_theme") || "light"; } catch { return "light"; }
      });

      const t = I18N[lang];

      // tema
      useEffect(() => {
        const root = document.documentElement;
        if (theme === "dark") root.classList.add("dark");
        else root.classList.remove("dark");
        try { localStorage.setItem("pokerandup_theme", theme); } catch {}
      }, [theme]);

      // router
      useEffect(() => {
        const onHash = () => setRoute(parseRoute(window.location.hash));
        window.addEventListener("hashchange", onHash);
        return () => window.removeEventListener("hashchange", onHash);
      }, []);

      // idioma
      useEffect(() => { try { localStorage.setItem("pokerandup_lang", lang); } catch {} }, [lang]);

      return (
        <div className="min-h-screen bg-gray-50 dark:bg-zinc-900 text-gray-800 dark:text-zinc-100">
          <Header
            teamCount={0}
            t={t}
            lang={lang}
            setLang={setLang}
            theme={theme}
            setTheme={setTheme}

            {route.name === "home" ? (
              <PokedexPage t={t} lang={lang} routeQS={route.qs} />
            ) : (
              <PokemonDetailPage id={route.id} t={t} lang={lang} />
            )}
          </main>
          <Footer />
        </div>
      );
    }

                <span style={{ fontWeight: "800", fontSize: "44px", color: "#2a75bb", WebkitTextStroke: "1px #ffcb05", textShadow: "2px 2px 6px rgba(0,0,0,0.5)" }}>Rand</span>

    // ===================== PÁGINA: Pokédex =====================
    function PokedexPage({ t, lang, routeQS }) {
      const PAGE_SIZE_OPTIONS = [24, 48, 72, 120, 200, 300];
      const [pageSize, setPageSize] = useState(Number(routeQS.ps || 48));
      const [totalCount, setTotalCount] = useState(0);
      const [page, setPage] = useState(Number(routeQS.p || 1));
      const [listLoading, setListLoading] = useState(false);
      const [error, setError] = useState("");

      // búsqueda
      const [query, setQuery] = useState(routeQS.q || "");
      const [searchLoading, setSearchLoading] = useState(false);
      const [searchResult, setSearchResult] = useState(null);
      const [suggestions, setSuggestions] = useState([]);
      const [nameIndex, setNameIndex] = useState([]); // [{name,id,url}]
      const debounceRef = useRef(null);
      const abortRef = useRef(null);

      // filtros y orden (persistidos en hash)
      const qsTypes = (routeQS.types || "").split(",").filter(Boolean);
      const [typeFilter, setTypeFilter] = useState(qsTypes);
      const [genFilter, setGenFilter] = useState(routeQS.gen || 'all');
      const [sortKey, setSortKey] = useState(routeQS.sort?.split(":")[0] || 'id');
      const [sortDir, setSortDir] = useState(routeQS.sort?.split(":")[1] || 'asc');

      // lista actual
      const [items, setItems] = useState([]);

      // si hay filtros activos, desactivar paginación y mostrar TODO
      const isFiltering = typeFilter.length > 0 || genFilter !== 'all';

      // Actualizar hash al cambiar filtros/búsqueda/paginación
      useEffect(() => {
        const qs = {
          q: query || undefined,
          types: typeFilter.join(",") || undefined,
          gen: genFilter !== "all" ? genFilter : undefined,
          sort: `${sortKey}:${sortDir}`,
          p: isFiltering ? undefined : page,
          ps: isFiltering ? undefined : pageSize,
        };
        history.replaceState(null, "", buildHomeHash(qs));
      }, [query, typeFilter, genFilter, sortKey, sortDir, page, pageSize, isFiltering]);

      // Índice (nombres+ids)
      useEffect(() => {
        let cancelled = false;
        (async () => {
          try {
            const r = await fetch("https://pokeapi.co/api/v2/pokemon?limit=1");
            const d = await r.json();
            if (!cancelled) setTotalCount(d.count || 1025);
          } catch (e) {
            if (!cancelled) setTotalCount(1025);
          }
          try {
            const all = await fetch("https://pokeapi.co/api/v2/pokemon?limit=20000").then((x) => x.json());
            const idx = (all.results || []).map((p) => ({ name: p.name, id: getIdFromUrl(p.url), url: p.url }));
            if (!cancelled) setNameIndex(idx.filter(x => x.id));
          } catch { }
        })();
        return () => { cancelled = true; };
      }, []);

      const maxPage = useMemo(() =>
        Math.max(1, Math.ceil((totalCount || 1) / (isFiltering ? (totalCount || 1) : pageSize))),
        [totalCount, pageSize, isFiltering]
      );

      // Lista normal (paginada) SOLO cuando NO hay filtros
      useEffect(() => {
        if (!totalCount || isFiltering) return;
        const offset = (page - 1) * pageSize;
        const url = `https://pokeapi.co/api/v2/pokemon?limit=${pageSize}&offset=${offset}`;
        let cancelled = false;
        setListLoading(true);
        setError("");

        (async () => {
          try {
            const base = await fetch(url).then((r) => r.json());
            const results = base.results || [];
            const details = await Promise.all(results.map(async (it) => getPokemonDetail(it.url)));
            if (!cancelled) setItems(details);
          } catch (e) {
            if (!cancelled) setError(t.couldNotLoadList);
          } finally {
            if (!cancelled) setListLoading(false);
          }
        })();

        return () => { cancelled = true; };
      }, [totalCount, page, pageSize, isFiltering, t.couldNotLoadList]);

      // Lista FILTRADA (sin paginación)
      useEffect(() => {
        if (!isFiltering || nameIndex.length === 0) return;
        let cancelled = false;
        setListLoading(true);
        setError("");

        (async () => {
          try {
            let candidateIds = nameIndex.map(x => x.id);

            // tipos -> intersección
            if (typeFilter.length > 0) {
              const sets = await Promise.all(typeFilter.map(t => getIdsForType(t)));
              let inter = new Set(sets[0]);
              for (let i = 1; i < sets.length; i++) {
                inter = new Set([...inter].filter(id => sets[i].has(id)));
              }
              candidateIds = candidateIds.filter(id => inter.has(id));
            }

            // generación
            if (genFilter !== 'all') {
              const [start, end] = rangeForGen(genFilter);
              candidateIds = candidateIds.filter(id => id >= start && id <= end);
            }

            // detalles (con cache)
            const details = await Promise.all(candidateIds.map(id => getPokemonDetail(id)));

            // si hay query, aplicar fuzzy client-side
            const nq = normalize(query);
            const filtered = nq
              ? details.filter(d => normalize(d.name).includes(nq) || String(d.id) === nq)
              : details;

            // ordenar
            const sorted = filtered.sort((a, b) => {
              if (sortKey === 'name') {
                const c = a.name.localeCompare(b.name);
                return sortDir === 'asc' ? c : -c;
              }
              const map = { id: [a.id, b.id], bst: [a.bst, b.bst], exp: [a.base_experience, b.base_experience] };
              const [va, vb] = map[sortKey] || [a.id, b.id];
              const c = va - vb;
              return sortDir === 'asc' ? c : -c;
            });

            if (!cancelled) setItems(sorted);
          } catch (e) {
            if (!cancelled) setError(t.couldNotLoadFiltered);
          } finally {
            if (!cancelled) setListLoading(false);
          }
        })();

        return () => { cancelled = true; };
      }, [isFiltering, nameIndex, typeFilter, genFilter, sortKey, sortDir, query, t.couldNotLoadFiltered]);

      // Sugerencias de búsqueda (fuzzy/diacríticos)
      useEffect(() => {
        if (!query) { setSuggestions([]); return; }
        clearTimeout(debounceRef.current);
        debounceRef.current = setTimeout(() => {
          const nq = normalize(query);
          const first = nameIndex
            .filter((p) => normalize(p.name).includes(nq) || String(p.id) === nq)
            .slice(0, 10);
          setSuggestions(first);
        }, 200);
        return () => clearTimeout(debounceRef.current);
      }, [query, nameIndex]);

      async function handleSearch(e) {
        e?.preventDefault?.();
        const q = (query || "").trim();
        if (!q) { setSearchResult(null); return; }
        try {
          setSearchLoading(true);
          setError("");
          abortRef.current?.abort?.();
          const controller = new AbortController();
          abortRef.current = controller;
          const r = await fetch(`https://pokeapi.co/api/v2/pokemon/${encodeURIComponent(q)}`, { signal: controller.signal });
          if (!r.ok) throw new Error("No encontrado");
          const d = await r.json();
          setSearchResult({
            id: d.id,
            name: d.name,
            image: d.sprites?.other?.["official-artwork"]?.front_default || artUrlById(d.id),
            types: d.types.map((t) => t.type.name),
            abilities: d.abilities.map((a) => a.ability.name),
            bst: d.stats.reduce((acc, s) => acc + (s.base_stat || 0), 0),
            height: d.height,
            weight: d.weight,
            base_experience: d.base_experience,
          });
        } catch (e) {
          setSearchResult(null);
          setError(t.notFoundSearch);
        } finally {
          setSearchLoading(false);
        }
      }

      function clearSearch() {
        setQuery("");
        setSearchResult(null);
        setError("");
        setSuggestions([]);
      }
      function goPage(p) { setPage((prev) => Math.min(Math.max(1, p), maxPage)); }

      function toggleType(tname) {
        setPage(1);
        setTypeFilter(prev => prev.includes(tname) ? prev.filter(x => x !== tname) : [...prev, tname]);
      }
      function clearFilters() {
        setTypeFilter([]);
        setGenFilter('all');
        setSortKey('id');
        setSortDir('asc');
      }

      // Equipo mini (con alerta rápida de debilidades): lo omitimos aquí para mantener el enfoque en buscador y lista.

      return (
        <>
          {/* === EQUIPO (ARRIBA) – versión compacta/expansible futura === */}
          <TeamLite t={t} lang={lang} />

          {/* === BUSCADOR (MEDIO) === */}
          <section aria-label="Buscador" className="mb-4 md:mb-6 bg-white dark:bg-zinc-950 rounded-2xl shadow p-3 md:p-4 relative">
            <form onSubmit={handleSearch} className="flex flex-col md:flex-row gap-2 md:items-center">
              <div className="relative flex-1 md:w-96">
                <input
                  value={query}
                  onChange={(e) => setQuery(e.target.value)}
                  placeholder={t.searchPlaceholder}
                  className="w-full px-3 py-2 rounded-xl border border-gray-300 dark:border-zinc-700 outline-none focus:ring-2 focus:ring-[#2a75bb] bg-white dark:bg-zinc-900"
                  aria-label={t.search}
                />
                {/* Sugerencias */}
                {suggestions.length > 0 && (
                  <div className="absolute z-20 mt-1 w-full bg-white dark:bg-zinc-900 border border-gray-200 dark:border-zinc-700 rounded-xl shadow max-h-60 overflow-auto">
                    {suggestions.map((sug) => (
                      <button
                        key={sug.id}
                        type="button"
                        onClick={() => { setQuery(String(sug.id)); setSuggestions([]); }}
                        className="w-full text-left px-3 py-2 hover:bg-gray-50 dark:hover:bg-zinc-800 flex justify-between text-sm"
                      >
                        <span>{titleCase(sug.name)}</span>
                        <span className="text-gray-500">#{sug.id}</span>
                      </button>
                    ))}
                  </div>
                )}
              </div>
              <div className="flex gap-2">
                <button type="submit" className="px-4 py-2 rounded-xl border border-gray-300 dark:border-zinc-700 hover:bg-gray-100 dark:hover:bg-zinc-800">{t.search}</button>
                <button type="button" onClick={clearSearch} className="px-3 py-2 rounded-xl border border-gray-200 dark:border-zinc-700 hover:bg-gray-100 dark:hover:bg-zinc-800">{t.clear}</button>
              </div>
            </form>
            {searchLoading && <p className="mt-2 text-sm text-gray-500 animate-pulse" aria-live="polite">Buscando…</p>}
            {searchResult && (
              <div className="mt-4">
                <h2 className="text-lg font-semibold mb-3">{t.result}</h2>
                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
                  <PokemonCard data={searchResult} lang={lang} />
                </div>
              </div>
            )}
          </section>

          {/* === FILTROS + ORDEN (MEDIO) === */}
          <section aria-label={t.filters} className="mb-4 md:mb-6 bg-white dark:bg-zinc-950 rounded-2xl shadow p-3 md:p-4">
            <div className="flex flex-col gap-3">
              {/* Tipos */}
              <div>
                <div className="flex items-center justify-between flex-wrap gap-2">
                  <h3 className="font-semibold">{t.filterByType}</h3>
                  <button onClick={clearFilters} className="text-sm px-3 py-1 rounded-lg border border-gray-300 dark:border-zinc-700 hover:bg-gray-50 dark:hover:bg-zinc-800">{t.filtersCleared}</button>
                </div>
                <div className="mt-2 flex flex-wrap gap-2">
                  {ALL_TYPES.map((ty) => {
                    const active = typeFilter.includes(ty);
                    const color = TYPE_COLORS[ty];
                    return (
                      <button
                        key={ty}
                        onClick={() => toggleType(ty)}
                        className={`px-2.5 py-1 rounded-full text-xs font-medium border transition ${active ? 'text-white' : 'text-gray-800 dark:text-zinc-100'}`}
                        style={{
                          backgroundColor: active ? color : 'transparent',
                          borderColor: color
                        }}
                        aria-pressed={active}
                      >
                        {lang === "es" ? (TYPE_ES[ty] ?? titleCase(ty)) : titleCase(ty)}
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* Generación + Orden */}
              <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                <div className="flex items-center gap-2">
                  <span className="text-sm text-gray-600 dark:text-zinc-400">{t.generation}:</span>
                  <select
                    value={genFilter}
                    onChange={(e) => { setGenFilter(e.target.value); setPage(1); }}
                    className="px-3 py-2 rounded-xl border border-gray-300 dark:border-zinc-700 bg-white dark:bg-zinc-900"
                    aria-label={t.generation}
                  >
                    <option value="all">{t.allGens}</option>
                    {GENERATIONS.map(g => (
                      <option key={g.key} value={g.key}>{g.label}</option>
                    ))}
                  </select>
                </div>
                <div className="flex items-center gap-2">
                  <span className="text-sm text-gray-600 dark:text-zinc-400">{t.sortBy}:</span>
                  <select
                    value={sortKey}
                    onChange={(e) => setSortKey(e.target.value)}
                    className="px-3 py-2 rounded-xl border border-gray-300 dark:border-zinc-700 bg-white dark:bg-zinc-900"
                    aria-label={t.sortBy}
                  >
                    <option value="id">{t.id}</option>
                    <option value="name">{t.name}</option>
                    <option value="bst">{t.bst}</option>
                    <option value="exp">{t.exp}</option>
                  </select>
                </div>
                <div className="flex items-center gap-2">
                  <span className="text-sm text-gray-600 dark:text-zinc-400">{t.direction}:</span>
                  <select
                    value={sortDir}
                    onChange={(e) => setSortDir(e.target.value)}
                    className="px-3 py-2 rounded-xl border border-gray-300 dark:border-zinc-700 bg-white dark:bg-zinc-900"
                    aria-label={t.direction}
                  >
                    <option value="asc">{t.asc}</option>
                    <option value="desc">{t.desc}</option>
                  </select>
                </div>
              </div>
            </div>
          </section>

          {/* === CONTROLES DE PÁGINA (ocultos si hay filtros) === */}
          {!isFiltering && (
            <section className="mb-4 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
              <div className="flex items-center gap-2 justify-center md:justify-start">
                <span className="text-sm text-gray-600 dark:text-zinc-400">{t.perPage}:</span>
                <select
                  className="h-10 px-3 rounded-xl border border-gray-300 dark:border-zinc-700 bg-white dark:bg-zinc-900"
                  value={pageSize}
                  onChange={(e) => { setPageSize(Number(e.target.value)); setPage(1); }}
                >
                  {PAGE_SIZE_OPTIONS.map((n) => (
                    <option key={n} value={n}>{n}</option>
                  ))}
                </select>
              </div>

              <div className="flex items-center gap-2 justify-center md:justify-end flex-nowrap overflow-x-auto md:overflow-visible">
                <button onClick={() => goPage(1)} className="h-10 px-3 rounded-xl border border-gray-300 dark:border-zinc-700 hover:bg-gray-100 dark:hover:bg-zinc-800" disabled={page === 1}>«</button>
                <button onClick={() => goPage(page - 1)} className="h-10 px-3 rounded-xl border border-gray-300 dark:border-zinc-700 hover:bg-gray-100 dark:hover:bg-zinc-800" disabled={page === 1}>‹</button>
                <span className="h-10 px-3 inline-flex items-center text-sm text-gray-700 dark:text-zinc-300 font-medium whitespace-nowrap" aria-live="polite">
                  {t.page} <b className="mx-1">{page}</b> {t.of} <b>{maxPage}</b>
                </span>
                <button onClick={() => goPage(page + 1)} className="h-10 px-3 rounded-xl border border-gray-300 dark:border-zinc-700 hover:bg-gray-100 dark:hover:bg-zinc-800" disabled={page === maxPage}>›</button>
                <button onClick={() => goPage(maxPage)} className="h-10 px-3 rounded-xl border border-gray-300 dark:border-zinc-700 hover:bg-gray-100 dark:hover:bg-zinc-800" disabled={page === maxPage}>»</button>
              </div>
            </section>
          )}

          {isFiltering && (
            <section className="mb-4 text-center text-sm text-gray-600 dark:text-zinc-400" aria-live="polite">
              {t.paginationOff} {t.showing} {items.length} {t.results}.
            </section>
          )}

          {/* === LISTA (AL FINAL) === */}
          <section className="rounded-2xl bg-white dark:bg-zinc-950 shadow p-3 md:p-4">
            {error && <div className="mb-4 p-3 rounded-xl bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-900 text-red-700 dark:text-red-300">{error}</div>}
            {listLoading ? (
              <div className="py-8 text-center animate-pulse">{t.loadingList}</div>
            ) : (
              <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 xl:grid-cols-8 gap-3 md:gap-4">
                {items.map((it) => <PokemonCard key={it.id} data={it} lang={lang} />)}
              </div>
            )}
          </section>
        </>
      );
    }

    // Equipo compacto con alerta rápida
    function TeamLite({ t, lang }) {
      const [team, setTeam] = useState(() => {
        try { return JSON.parse(localStorage.getItem("pokerandup_team") || "[]"); } catch { return []; }
      });
      const [teamDefense, setTeamDefense] = useState(null);

      useEffect(() => { try { localStorage.setItem("pokerandup_team", JSON.stringify(team)); } catch {} }, [team]);
      useEffect(() => {
        let cancelled = false;
        (async () => {
          const counts = { weak: Object.fromEntries(ALL_TYPES.map(t => [t, 0])), resist: Object.fromEntries(ALL_TYPES.map(t => [t, 0])), immune: Object.fromEntries(ALL_TYPES.map(t => [t, 0])) };
          for (const member of team) {
            const mult = await fetchDefenseMultipliers(member.types);
            for (const t of ALL_TYPES) {
              const m = mult[t];
              if (m === 0) counts.immune[t]++;
              else if (m > 1) counts.weak[t]++;
              else if (m < 1) counts.resist[t]++;
            }
          }
          if (!cancelled) setTeamDefense(counts);
        })();
        return () => { cancelled = true; };
      }, [team]);

      function removeFromTeam(id) { setTeam(prev => prev.filter(x => x.id !== id)); }
      function clearTeam() { setTeam([]); }

      const teamLen = team.length;
      const dangerTypes = useMemo(() => {
        if (!teamDefense || teamLen === 0) return [];
        const threshold = Math.ceil(teamLen / 2);
        return ALL_TYPES
          .map((t) => ({ t, count: teamDefense.weak[t] }))
          .filter((x) => x.count >= threshold)
          .sort((a, b) => b.count - a.count);
      }, [teamDefense, teamLen]);

      return (
        <section className="mb-4 md:mb-6 rounded-2xl bg-white dark:bg-zinc-950 shadow p-3 md:p-4">
          <div className="flex items-center justify-between">
            <h2 className="text-lg font-semibold">{t.myTeam} ({teamLen}/6)</h2>
            <div className="flex gap-2">
              <button onClick={clearTeam} className="px-3 py-1.5 rounded-xl border border-gray-300 dark:border-zinc-700 hover:bg-gray-100 dark:hover:bg-zinc-800 text-sm">{t.clearTeam}</button>
            </div>
          </div>

          <div className="mt-3 grid grid-cols-3 sm:grid-cols-6 gap-3">
            {Array.from({ length: 6 }).map((_, i) => {
              const m = team[i];
              const color = m ? (TYPE_COLORS[m.types[0]] || "#ddd") : "#e5e7eb";
              return (
                <div
                  key={`slot-${i}`}
                  className={`relative aspect-square rounded-xl border overflow-hidden grid place-items-center ${m ? "" : "text-gray-400 border-dashed"}`}
                  style={{ borderColor: color, backgroundColor: m ? `${color}22` : "transparent" }}
                >
                  {m ? (
                    <>
                      <img
                        src={artUrlById(m.id)}
                        alt={`${titleCase(m.name)} – artwork`}
                        onError={(e) => e.currentTarget.src = fallbackSpriteById(m.id)}
                        className="w-full h-full object-contain p-2"
                        decoding="async"
                        loading="lazy"
                      />
                      <div className="absolute bottom-1 left-1 right-1 flex items-center justify-between text-[11px]">
                        <span className="px-1.5 py-0.5 rounded text-white" style={{ backgroundColor: color }}>{titleCase(m.name)}</span>
                        <button onClick={() => removeFromTeam(m.id)} className="px-1.5 py-0.5 rounded bg-white/90 dark:bg-zinc-900/90 border text-gray-700 dark:text-zinc-200">Quitar</button>
                      </div>
                    </>
                  ) : (
                    <span>{t.empty}</span>
                  )}
                </div>
              );
            })}
          </div>

          {dangerTypes.length > 0 && (
            <div className="mt-3 text-sm">
              {t.compareHint}{" "}
              <span className="inline-flex flex-wrap gap-1">
                {dangerTypes.slice(0,4).map(({t:ty}) => <TypeBadge key={ty} type={ty} lang={lang} />)}
              </span>
            </div>
          )}
        </section>
      );
    }

    // ===================== Detalle =====================
    function PokemonDetailPage({ id, t, lang }) {
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState("");
      const [pokemon, setPokemon] = useState(null);
      const [displayName, setDisplayName] = useState(null);
      const [speciesGenus, setSpeciesGenus] = useState("");
      const [evoEdges, setEvoEdges] = useState([]); // [{from:{id,name}, to:{id,name}, details:[]}]
      const [multipliersDef, setMultipliersDef] = useState(null);
      const [multipliersAtk, setMultipliersAtk] = useState(null);
      const [abilityDetails, setAbilityDetails] = useState([]);
      const [activeTab, setActiveTab] = useState("stats"); // stats | types | evo | moves | encounters

      // Moves tab state
      const [movesRows, setMovesRows] = useState([]);
      const [movesLoading, setMovesLoading] = useState(false);
      const [mvType, setMvType] = useState("any");
      const [mvCat, setMvCat] = useState("any");
      const [mvPower, setMvPower] = useState("");
      const [mvAcc, setMvAcc] = useState("");
      const [mvQuery, setMvQuery] = useState("");

      // SEO meta
      function setMetaDescription(desc) {
        let el = document.querySelector('meta[name="description"]');
        if (!el) {
          el = document.createElement('meta');
          el.setAttribute('name','description');
          document.head.appendChild(el);
        }
        el.setAttribute('content', desc);
      }

      useEffect(() => {
        let cancelled = false;
        (async () => {
          try {
            setLoading(true);
            setError("");
            const detail = await getPokemonDetail(id);
            if (cancelled) return;
            setPokemon(detail);

            // species (para nombre local y genus/descripción corta)
            const species = await getPokemonSpecies(detail.id);
            if (cancelled) return;
            const localizedName =
              (species.names || []).find(n => n.language?.name === (lang==="es"?"es":"en"))?.name
              || detail.name;
            setDisplayName(localizedName);
            const genus = (species.genera || []).find(g => g.language?.name === (lang==="es"?"es":"en"))?.genus || "";
            setSpeciesGenus(genus);

            // Title + meta
            document.title = `${titleCase(localizedName)} – PokeRandup`;
            setMetaDescription(`${titleCase(localizedName)} (${String(detail.id).padStart(4,"0")}) – ${genus || "Pokémon"}. Tipos: ${detail.types.join(", ")}.`);

            // evolución con métodos
            const evoUrl = species.evolution_chain?.url;
            if (evoUrl) {
              const chain = await fetch(evoUrl).then((r) => r.json());
              const edges = [];
              function idFromSpeciesUrl(u){ return Number((u||"").match(/\/pokemon-species\/(\d+)\/?$/)?.[1]); }
              function walk(node) {
                const fromId = idFromSpeciesUrl(node.species?.url);
                node.evolves_to?.forEach(next => {
                  const toId = idFromSpeciesUrl(next.species?.url);
                  edges.push({
                    from:{ id: fromId, name: node.species?.name },
                    to:{ id: toId, name: next.species?.name },
                    details: next.evolution_details || []
                  });
                  walk(next);
                });
              }
              walk(chain.chain);
              if (!cancelled) setEvoEdges(edges);
            } else if (!cancelled) {
              setEvoEdges([]);
            }

            // tipos: defensa + ataque
            const typeNames = detail.types;
            const [defM, atkM] = await Promise.all([
              fetchDefenseMultipliers(typeNames),
              fetchOffenseMultipliers(typeNames),
            ]);
            if (!cancelled) {
              setMultipliersDef(defM);
              setMultipliersAtk(atkM);
            }

            // habilidades
            const abilities = detail.abilities || [];
            const abilityInfos = await Promise.all(abilities.map(async (name) => {
              // fetch ability by name to get es/en
              try {
                const d = await fetch(`https://pokeapi.co/api/v2/ability/${name}`).then(r=>r.json());
                const name_en = (d.names || []).find((n) => n.language?.name === "en")?.name || d.name;
                const name_es = (d.names || []).find((n) => n.language?.name === "es")?.name || name_en;
                const flavor_es = (d.flavor_text_entries || []).find((e) => e.language?.name === "es")?.flavor_text;
                const effect_en = (d.effect_entries || []).find((e) => e.language?.name === "en")?.short_effect ||
                                  (d.effect_entries || []).find((e) => e.language?.name === "en")?.effect;
                const description = (flavor_es || effect_en || "—").replace(/\s+/g, " ");
                return { name_es, name_en, description };
              } catch { return { name_es: name, name_en: name, description:"—" }; }
            }));
            if (!cancelled) setAbilityDetails(abilityInfos);

          } catch (e) {
            if (!cancelled) setError("No se pudo cargar el Pokémon.");
          } finally {
            if (!cancelled) setLoading(false);
          }
        })();
        return () => { cancelled = true; };
      }, [id, lang]);

      useEffect(() => {
        // Actualizar título/meta si cambia el idioma y ya tenemos datos
        if (pokemon && displayName) {
          document.title = `${titleCase(displayName)} – PokeRandup`;
          setMetaDescription(`${titleCase(displayName)} (${String(pokemon.id).padStart(4,"0")}) – ${speciesGenus || "Pokémon"}.`);
        }
      }, [lang, displayName, speciesGenus, pokemon]);

      // preparar stats y tipos
      const pid = pokemon?.id;
      const name = pokemon?.name;
      const image = pokemon?.image;
      const types = pokemon?.types || [];
      const stats = pokemon?.stats || [];
      const heightM = pokemon ? pokemon.height / 10 : 0;
      const weightKg = pokemon ? pokemon.weight / 10 : 0;

      // construir chips de métodos de evolución
      function evoMethodChips(details) {
        const d = details?.[0] || {};
        const chips = [];
        if (d.min_level) chips.push(`${t.level} ${d.min_level}`);
        if (d.time_of_day) chips.push(d.time_of_day === 'day' ? t.day : t.night);
        if (d.item?.name) chips.push(`${t.stone}: ${titleCase(d.item.name.replace(/-/g,' '))}`);
        if (d.trigger?.name === 'trade') chips.push(t.trade);
        if (d.friendship) chips.push(`${t.friendship} ≥ ${d.friendship}`);
        if (d.gender === 1) chips.push(`${t.gender}: ${t.female}`);
        if (d.gender === 2) chips.push(`${t.gender}: ${t.male}`);
        if (d.known_move_type?.name) chips.push(`${t.moveTypeReq} ${titleCase(d.known_move_type.name)}`);
        if (d.location?.name) chips.push(titleCase(d.location.name.replace(/-/g," ")));
        return chips;
      }

      // Tipos: listas ordenadas
      const defWeak = [], defResist = [], defImmune = [];
      if (multipliersDef) {
        for (const ty of ALL_TYPES) {
          const m = multipliersDef[ty];
          if (m === 0) defImmune.push([ty, m]);
          else if (m > 1) defWeak.push([ty, m]);
          else if (m < 1) defResist.push([ty, m]);
        }
        defWeak.sort((a,b)=> b[1]-a[1]);
        defResist.sort((a,b)=> a[1]-b[1]);
      }
      const atkStrong = [], atkWeak = [], atkNull = [];
      if (multipliersAtk) {
        for (const ty of ALL_TYPES) {
          const m = multipliersAtk[ty];
          if (m === 0) atkNull.push([ty,m]);
          else if (m > 1) atkStrong.push([ty,m]);
          else if (m < 1) atkWeak.push([ty,m]);
        }
        atkStrong.sort((a,b)=> b[1]-a[1]);
        atkWeak.sort((a,b)=> a[1]-b[1]);
      }

      // MOVES: cargar al abrir tab
      useEffect(() => {
        if (activeTab !== "moves" || !pokemon) return;
        let cancelled = false;
        (async () => {
          try {
            setMovesLoading(true);
            // Tomamos todos los moves del Pokémon, pero traemos detalles básicos (type, power, acc, class)
            const rows = await Promise.all(
              (pokemon.moves || []).slice(0, 200).map(async (mv) => {
                const d = await getMoveDetail(mv.move.url);
                // buscamos el último registro de version_group_details (aprox)
                const vg = (mv.version_group_details || []).slice(-1)[0] || mv.version_group_details?.[0];
                return {
                  name: d.name,
                  type: d.type,
                  power: d.power ?? null,
                  accuracy: d.accuracy ?? null,
                  category: d.damage_class,
                  method: vg?.move_learn_method?.name,
                  level: vg?.level_learned_at ?? null,
                  version_group: vg?.version_group?.name,
                };
              })
            );
            if (!cancelled) setMovesRows(rows);
          } finally {
            if (!cancelled) setMovesLoading(false);
          }
        })();
        return () => { cancelled = true; };
      }, [activeTab, pokemon]);

      // MOVES: filtrado en memoria
      const filteredMoves = useMemo(() => {
        const nq = normalize(mvQuery);
        return movesRows.filter(r => {
          if (mvType !== "any" && r.type !== mvType) return false;
          if (mvCat !== "any" && r.category !== mvCat) return false;
          if (mvPower && (r.power ?? 0) < Number(mvPower)) return false;
          if (mvAcc && (r.accuracy ?? 0) < Number(mvAcc)) return false;
          if (nq && !normalize(r.name).includes(nq)) return false;
          return true;
        }).sort((a,b)=> (b.level??0) - (a.level??0));
      }, [movesRows, mvType, mvCat, mvPower, mvAcc, mvQuery]);

      // Encuentros
      const [encLoading, setEncLoading] = useState(false);
      const [encRows, setEncRows] = useState([]);
      useEffect(() => {
        if (activeTab !== "encounters" || !pokemon) return;
        let cancelled = false;
        (async () => {
          try {
            setEncLoading(true);
            const data = await getEncounters(pokemon.id);
            if (cancelled) return;
            const rows = data.map(e => ({
              area: e.location_area?.name,
              versions: (e.version_details || []).map(v => v.version?.name)
            }));
            setEncRows(rows);
          } finally { if (!cancelled) setEncLoading(false); }
        })();
        return () => { cancelled = true; };
      }, [activeTab, pokemon]);

      if (loading) return <div className="py-16 text-center animate-pulse">Cargando…</div>;
      if (error) return <div className="p-4 rounded-2xl bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-900 text-red-700 dark:text-red-300">{error}</div>;
      if (!pokemon) return null;

      return (
        <div className="grid grid-cols-1 xl:grid-cols-5 gap-6">
          {/* Lado izquierdo */}
          <section className="xl:col-span-2 rounded-2xl bg-white dark:bg-zinc-950 shadow p-4 flex flex-col gap-4">
            <div className="flex items-start justify-between">
              <div>
                <div className="text-sm text-gray-500 dark:text-zinc-400">#{String(pid).padStart(4, "0")}</div>
                <h2 className="text-2xl font-extrabold">{titleCase(displayName || name)}</h2>
                <div className="text-sm text-gray-500 dark:text-zinc-400">{speciesGenus}</div>
                <div className="mt-2 flex flex-wrap gap-2">
                  {types.map((tname) => <TypeBadge key={tname} type={tname} lang={lang} />)}
                </div>
              </div>
              <div className="text-right text-sm text-gray-600 dark:text-zinc-300">
                <div><b>{t.height}:</b> {heightM} {t.meters}</div>
                <div><b>{t.weight}:</b> {weightKg} {t.kilograms}</div>
              </div>
            </div>
            <div className="grid place-items-center rounded-xl" style={{ background: "linear-gradient(135deg,#ffffff,#f5f7ff)" }}>
              <img
                src={image}
                alt={`${titleCase(displayName || name)} – artwork`}
                onError={(e) => (e.currentTarget.src = fallbackSpriteById(pid))}
                className="w-full max-w-md object-contain"
                decoding="async"
              />
            </div>
            <div className="flex justify-end">
              <AddToTeamButton pokemon={pokemon} />
            </div>
          </section>

          {/* Tabs lado derecho */}
          <section className="xl:col-span-3 rounded-2xl bg-white dark:bg-zinc-950 shadow p-0">
            {/* Tabs header */}
            <div role="tablist" className="flex overflow-x-auto border-b border-gray-200 dark:border-zinc-800">
              {[
                ["stats", t.baseStats],
                ["types", t.strengthsWeaknesses],
                ["evo", t.evolutionLine],
                ["moves", t.moves],
                ["encounters", t.encounters],
              ].map(([key,label]) => (
                <button
                  key={key}
                  role="tab"
                  aria-selected={activeTab===key}
                  onClick={()=>setActiveTab(key)}
                  className={`px-4 py-3 text-sm font-medium whitespace-nowrap ${activeTab===key ? "text-[#2a75bb] border-b-2 border-[#2a75bb]" : "text-gray-600 dark:text-zinc-400 hover:text-gray-900 dark:hover:text-zinc-200"}`}
                >{label}</button>
              ))}
            </div>

            {/* Tabs content */}
            <div className="p-4">
              {activeTab==="stats" && (
                <div>
                  <div className="space-y-2">
                    {stats.map((s) => (
                      <div key={s.name} className="grid grid-cols-5 gap-2 items-center">
                        <div className="col-span-2 text-sm font-medium text-gray-700 dark:text-zinc-200">{titleCase(s.name.replace(/-/g, " "))}</div>
                        <div className="col-span-2 h-3 bg-gray-100 dark:bg-zinc-800 rounded">
                          <div className="h-3 rounded" style={{ width: `${Math.min(100, (s.value / 180) * 100)}%`, background: "linear-gradient(90deg,#003049,#F77F00)" }}></div>
                        </div>
                        <div className="text-sm text-gray-800 dark:text-zinc-200 font-semibold tabular-nums text-right">{s.value}</div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {activeTab==="types" && (
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                  {/* Defensa */}
                  <div>
                    <h3 className="font-semibold mb-2">{t.defense}</h3>
                    {!multipliersDef ? <p className="text-sm text-gray-600 dark:text-zinc-400">—</p> : (
                      <div className="space-y-3">
                        <div>
                          <h4 className="text-sm font-semibold mb-1">Debilidades</h4>
                          {defWeak.length===0 ? <p className="text-sm text-gray-600 dark:text-zinc-400">{t.none}</p> :
                            <div className="flex flex-wrap gap-2">{defWeak.map(([ty,m]) => <TypeBadge key={`w-${ty}`} type={ty} lang={lang} label={`${lang==="es"?TYPE_ES[ty]:titleCase(ty)} x${m}`} />)}</div>}
                        </div>
                        <div>
                          <h4 className="text-sm font-semibold mb-1">Resistencias</h4>
                          {defResist.length===0 ? <p className="text-sm text-gray-600 dark:text-zinc-400">{t.none}</p> :
                            <div className="flex flex-wrap gap-2">{defResist.map(([ty,m]) => <TypeBadge key={`r-${ty}`} type={ty} lang={lang} label={`${lang==="es"?TYPE_ES[ty]:titleCase(ty)} x${m}`} />)}</div>}
                        </div>
                        <div>
                          <h4 className="text-sm font-semibold mb-1">Inmunidades</h4>
                          {defImmune.length===0 ? <p className="text-sm text-gray-600 dark:text-zinc-400">{t.none}</p> :
                            <div className="flex flex-wrap gap-2">{defImmune.map(([ty,m]) => <TypeBadge key={`i-${ty}`} type={ty} lang={lang} label={`${lang==="es"?TYPE_ES[ty]:titleCase(ty)} x0`} />)}</div>}
                        </div>
                      </div>
                    )}
                  </div>

                  {/* Ataque */}
                  <div>
                    <h3 className="font-semibold mb-2">{t.offense}</h3>
                    {!multipliersAtk ? <p className="text-sm text-gray-600 dark:text-zinc-400">—</p> : (
                      <div className="space-y-3">
                        <div>
                          <h4 className="text-sm font-semibold mb-1">Fuertes contra</h4>
                          {atkStrong.length===0 ? <p className="text-sm text-gray-600 dark:text-zinc-400">{t.none}</p> :
                            <div className="flex flex-wrap gap-2">{atkStrong.map(([ty,m]) => <TypeBadge key={`aw-${ty}`} type={ty} lang={lang} label={`${lang==="es"?TYPE_ES[ty]:titleCase(ty)} x${m}`} />)}</div>}
                        </div>
                        <div>
                          <h4 className="text-sm font-semibold mb-1">Débiles contra</h4>
                          {atkWeak.length===0 ? <p className="text-sm text-gray-600 dark:text-zinc-400">{t.none}</p> :
                            <div className="flex flex-wrap gap-2">{atkWeak.map(([ty,m]) => <TypeBadge key={`al-${ty}`} type={ty} lang={lang} label={`${lang==="es"?TYPE_ES[ty]:titleCase(ty)} x${m}`} />)}</div>}
                        </div>
                        <div>
                          <h4 className="text-sm font-semibold mb-1">Sin efecto</h4>
                          {atkNull.length===0 ? <p className="text-sm text-gray-600 dark:text-zinc-400">{t.none}</p> :
                            <div className="flex flex-wrap gap-2">{atkNull.map(([ty]) => <TypeBadge key={`an-${ty}`} type={ty} lang={lang} label={`${lang==="es"?TYPE_ES[ty]:titleCase(ty)} x0`} />)}</div>}
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              )}

              {activeTab==="evo" && (
                <div>
                  <h3 className="sr-only">{t.evolutionLine}</h3>
                  {evoEdges.length === 0 ? (
                    <p className="text-sm text-gray-600 dark:text-zinc-400">{t.notAvailable}</p>
                  ) : (
                    <div className="space-y-4">
                      {groupEvoEdges(evoEdges).map((row, idx) => (
                        <div key={idx} className="flex flex-col items-center gap-3 text-center md:flex-row md:justify-center md:gap-6">
                          {/* origen */}
                          <EvoNode id={row.from.id} name={row.from.name} lang={lang} />
                          {/* flechas + destinos */}
                          {row.to.map((edge, i) => (
                            <React.Fragment key={`${edge.to.id}-${i}`}>
                              {/* Flecha */}
                              <svg className="hidden md:block w-6 h-6 text-[#2a75bb] opacity-70" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                                <path d="M9 6l6 6-6 6" />
                              </svg>
                              <svg className="w-5 h-5 text-[#2a75bb] opacity-70 md:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                                <path d="M6 9l6 6 6-6" />
                              </svg>

                              <div className="flex flex-col items-center gap-2">
                                <EvoNode id={edge.to.id} name={edge.to.name} lang={lang} />
                                {/* chips método */}
                                <div className="flex flex-wrap gap-1 justify-center">
                                  {evoMethodChips(edge.details).map((c, j)=>
                                    <span key={j} className="px-2 py-0.5 text-[11px] rounded bg-gray-100 dark:bg-zinc-800 border border-gray-200 dark:border-zinc-700">{c}</span>
                                  )}
                                </div>
                              </div>
                            </React.Fragment>
                          ))}
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}

              {activeTab==="moves" && (
                <div>
                  <h3 className="font-semibold mb-3">{t.filterMoves}</h3>
                  <div className="grid grid-cols-1 md:grid-cols-5 gap-2 mb-3">
                    <input value={mvQuery} onChange={e=>setMvQuery(e.target.value)} className="px-3 py-2 rounded-xl border border-gray-300 dark:border-zinc-700 bg-white dark:bg-zinc-900" placeholder={t.moveName} aria-label={t.moveName} />
                    <select value={mvType} onChange={e=>setMvType(e.target.value)} className="px-3 py-2 rounded-xl border border-gray-300 dark:border-zinc-700 bg-white dark:bg-zinc-900" aria-label={t.type}>
                      <option value="any">{t.any}</option>
                      {ALL_TYPES.map(ty => <option key={ty} value={ty}>{lang==="es"?TYPE_ES[ty]:titleCase(ty)}</option>)}
                    </select>
                    <select value={mvCat} onChange={e=>setMvCat(e.target.value)} className="px-3 py-2 rounded-xl border border-gray-300 dark:border-zinc-700 bg-white dark:bg-zinc-900" aria-label={t.category}>
                      <option value="any">{t.any}</option>
                      <option value="physical">{t.physical}</option>
                      <option value="special">{t.special}</option>
                      <option value="status">{t.status}</option>
                    </select>
                    <input type="number" min="0" value={mvPower} onChange={e=>setMvPower(e.target.value)} className="px-3 py-2 rounded-xl border border-gray-300 dark:border-zinc-700 bg-white dark:bg-zinc-900" placeholder={t.minPower} aria-label={t.minPower} />
                    <input type="number" min="0" value={mvAcc} onChange={e=>setMvAcc(e.target.value)} className="px-3 py-2 rounded-xl border border-gray-300 dark:border-zinc-700 bg-white dark:bg-zinc-900" placeholder={t.minAcc} aria-label={t.minAcc} />
                  </div>

                  {movesLoading ? (
                    <div className="py-6 text-center animate-pulse">Cargando movimientos…</div>
                  ) : (
                    <div className="overflow-auto rounded-lg border border-gray-200 dark:border-zinc-800">
                      <table className="min-w-full text-sm">
                        <thead className="bg-gray-50 dark:bg-zinc-900">
                          <tr className="text-left">
                            <th className="px-3 py-2">{t.moveName}</th>
                            <th className="px-3 py-2">{t.type}</th>
                            <th className="px-3 py-2">{t.category}</th>
                            <th className="px-3 py-2">{t.power}</th>
                            <th className="px-3 py-2">{t.accuracy}</th>
                            <th className="px-3 py-2">{t.method}</th>
                            <th className="px-3 py-2">{t.level}</th>
                            <th className="px-3 py-2">{t.version}</th>
                          </tr>
                        </thead>
                        <tbody>
                          {filteredMoves.map((r,i)=>(
                            <tr key={`${r.name}-${i}`} className={i%2 ? "bg-white dark:bg-zinc-950" : "bg-gray-50/60 dark:bg-zinc-900/50"}>
                              <td className="px-3 py-2 capitalize">{r.name.replace(/-/g," ")}</td>
                              <td className="px-3 py-2"><TypeBadge type={r.type||"normal"} lang={lang} /></td>
                              <td className="px-3 py-2 capitalize">{r.category}</td>
                              <td className="px-3 py-2">{r.power ?? "—"}</td>
                              <td className="px-3 py-2">{r.accuracy ?? "—"}</td>
                              <td className="px-3 py-2 capitalize">{(r.method||"—").replace(/-/g," ")}</td>
                              <td className="px-3 py-2">{r.level ?? "—"}</td>
                              <td className="px-3 py-2 capitalize">{(r.version_group||"—").replace(/-/g," ")}</td>
                            </tr>
                          ))}
                          {filteredMoves.length === 0 && (
                            <tr><td colSpan="8" className="px-3 py-4 text-center text-gray-500 dark:text-zinc-400">—</td></tr>
                          )}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>
              )}

              {activeTab==="encounters" && (
                <div>
                  {encLoading ? (
                    <div className="py-6 text-center animate-pulse">Cargando encuentros…</div>
                  ) : (
                    <>
                      {encRows.length === 0 ? (
                        <p className="text-sm text-gray-600 dark:text-zinc-400">{t.noEncounters}</p>
                      ) : (
                        <div className="space-y-3">
                          {encRows.map((r, i)=>(
                            <div key={i} className="p-3 rounded-xl border border-gray-200 dark:border-zinc-800">
                              <div className="font-medium capitalize mb-1">{(r.area||"").replace(/-/g," ")}</div>
                              <div className="flex flex-wrap gap-1">
                                {r.versions.map((v,j)=>(<span key={j} className="px-2 py-0.5 text-xs rounded bg-gray-100 dark:bg-zinc-800 border border-gray-200 dark:border-zinc-700 capitalize">{v.replace(/-/g," ")}</span>))}
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </>
                  )}
                </div>
              )}

              {/* Habilidades – siempre visible al final como sección extra */}
              <div className="mt-6">
                <h3 className="text-lg font-semibold mb-3">{t.abilities}</h3>
                {abilityDetails.length === 0 ? (
                  <p className="text-sm text-gray-600 dark:text-zinc-400">—</p>
                ) : (
                  <ul className="space-y-3">
                    {abilityDetails.map((ab, idx) => (
                      <li key={`${ab.name_en}-${idx}`} className="text-sm">
                        <div className="font-semibold">{lang==="es"?ab.name_es:ab.name_en} <span className="text-gray-500 dark:text-zinc-400">({lang==="es"?ab.name_en:ab.name_es})</span></div>
                        <div className="text-gray-700 dark:text-zinc-300 leading-snug">{ab.description}</div>
                      </li>
                    ))}
                  </ul>
                )}
              </div>
            </div>
          </section>
        </div>
      );
    }

    function groupEvoEdges(edges) {
      // agrupa por "from.id" -> {from, to:[edge,...]}
      const byFrom = new Map();
      for (const e of edges) {
        if (!byFrom.has(e.from.id)) byFrom.set(e.from.id, { from:e.from, to:[] });
        byFrom.get(e.from.id).to.push(e);
      }
      return [...byFrom.values()];
    }

    function EvoNode({ id, name, lang }) {
      return (
        <a href={`#/pokemon/${id}`} className="flex flex-col items-center gap-2 p-2 rounded-lg hover:bg-gray-50 dark:hover:bg-zinc-800 transition" aria-label={`Ir a ${titleCase(name)}`}>
          <img
            src={artUrlById(id)}
            alt={`${titleCase(name)} – artwork`}
            onError={(e) => (e.currentTarget.src = fallbackSpriteById(id))}
            className="w-16 h-16 sm:w-20 sm:h-20 object-contain"
            decoding="async"
          />
          <div className="text-xs sm:text-sm font-medium capitalize">{titleCase(name)}</div>
        </a>
      );
    }

    function AddToTeamButton({ pokemon }) {
      function add() {
        try {
          const team = JSON.parse(localStorage.getItem("pokerandup_team") || "[]");
          if (team.find(x => x.id === pokemon.id) || team.length >= 6) return;
          const entry = { id: pokemon.id, name: pokemon.name, image: pokemon.image || artUrlById(pokemon.id), types: pokemon.types || [] };
          const next = [...team, entry];
          localStorage.setItem("pokerandup_team", JSON.stringify(next));
          alert("Añadido al equipo");
        } catch {}
      }
      const color = TYPE_COLORS[pokemon.types[0]] || "#003049";
      return (
        <button onClick={add} className="px-4 py-2 rounded-xl text-white" style={{ backgroundColor: color }}>
          Añadir al equipo
        </button>
      );
    }

    // ===================== Tests básicos =====================
    (function runTests() {
      try {
        let passed = 0, failed = 0;
        const t1 = getIdFromUrl("https://pokeapi.co/api/v2/pokemon/25/") === 25; t1 ? passed++ : failed++;
        const t2 = titleCase("special attack") === "Special Attack"; t2 ? passed++ : failed++;
        const t3 = artUrlById(1).includes("official-artwork/1.png"); const t4 = fallbackSpriteById(1).endsWith("/pokemon/1.png"); (t3 && t4) ? passed++ : failed++;
        console.log(`PokeRandup tests → passed: ${passed}, failed: ${failed}`);
      } catch (err) { console.warn("PokeRandup tests error:", err); }
    })();

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<PokeRandupApp />);
  </script>
</body>
</html>
