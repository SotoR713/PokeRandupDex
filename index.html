<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PokeRandup – Pokédex</title>
  <meta name="description"
    content="PokeRandup: Pokédex con equipo, filtros, línea evolutiva, fortalezas/debilidades, movimientos y más.">

  <!-- Paleta/tema -->
  <script>window.tailwind = { config: { darkMode: 'class' } };</script>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 UMD -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel (JSX in-page) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    html,
    body,
    #root {
      height: 100%
    }

    :focus-visible {
      outline: 3px solid #2a75bb66;
      outline-offset: 2px;
      border-radius: 10px
    }
  </style>
</head>

<body class="min-h-screen bg-gray-50 text-gray-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    /* -------------------- Utils -------------------- */
    const TYPE_COLORS = { normal: "#A8A77A", fire: "#EE8130", water: "#6390F0", electric: "#F7D02C", grass: "#7AC74C", ice: "#96D9D6", fighting: "#C22E28", poison: "#A33EA1", ground: "#E2BF65", flying: "#A98FF3", psychic: "#F95587", bug: "#A6B91A", rock: "#B6A136", ghost: "#735797", dragon: "#6F35FC", dark: "#705746", steel: "#B7B7CE", fairy: "#D685AD" };
    const TYPE_ES = { normal: "Normal", fire: "Fuego", water: "Agua", electric: "Eléctrico", grass: "Planta", ice: "Hielo", fighting: "Lucha", poison: "Veneno", ground: "Tierra", flying: "Volador", psychic: "Psíquico", bug: "Bicho", rock: "Roca", ghost: "Fantasma", dragon: "Dragón", dark: "Siniestro", steel: "Acero", fairy: "Hada" };
    const ALL_TYPES = Object.keys(TYPE_COLORS);
    const GENERATIONS = [
      { key: '1', label: 'Gen I – Kanto (1–151)', range: [1, 151] },
      { key: '2', label: 'Gen II – Johto (152–251)', range: [152, 251] },
      { key: '3', label: 'Gen III – Hoenn (252–386)', range: [252, 386] },
      { key: '4', label: 'Gen IV – Sinnoh (387–493)', range: [387, 493] },
      { key: '5', label: 'Gen V – Teselia (494–649)', range: [494, 649] },
      { key: '6', label: 'Gen VI – Kalos (650–721)', range: [650, 721] },
      { key: '7', label: 'Gen VII – Alola (722–809)', range: [722, 809] },
      { key: '8', label: 'Gen VIII – Galar/Hisui (810–905)', range: [810, 905] },
      { key: '9', label: 'Gen IX – Paldea (906–1025)', range: [906, 1025] },
    ];
    const rangeForGen = (k) => GENERATIONS.find(g => g.key === k)?.range ?? null;
    const titleCase = (s) => (s || "").replace(/\b\w/g, c => c.toUpperCase());
    const getIdFromUrl = (u) => Number(((u || "").match(/\/pokemon\/(\d+)\/?$/) || [])[1] || ((u || "").match(/\/pokemon-species\/(\d+)\/?$/) || [])[1] || NaN);
    const normalize = (s) => (s || "").toString().normalize("NFD").replace(/\p{Diacritic}/gu, "").toLowerCase();

    /* Sprites: Pokémon HOME (consistentes normal/shiny) */
    const homeUrl = (id) => `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/home/${id}.png`;
    const homeShinyUrl = (id) => `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/home/shiny/${id}.png`;
    const defaultSpriteById = (id) => `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`;

    function TypeBadge({ type, label }) {
      const color = TYPE_COLORS[type] || "#999";
      return <span className="px-2 py-0.5 text-xs rounded-full text-white shadow whitespace-nowrap" style={{ backgroundColor: color }}>{label ?? (TYPE_ES[type] ?? titleCase(type))}</span>;
    }

    /* -------------------- Simple caches -------------------- */
    const DETAIL_CACHE = new Map(); // id -> detail
    const SPECIES_CACHE = new Map(); // id -> species
    const TYPE_CACHE = new Map(); // type -> json
    const TYPE_INDEX_CACHE = new Map(); // type -> Set(ids)
    const MOVE_CACHE = new Map(); // url -> detail

    async function getTypeDetail(type) {
      if (TYPE_CACHE.has(type)) return TYPE_CACHE.get(type);
      const d = await fetch(`https://pokeapi.co/api/v2/type/${type}`).then(r => r.json());
      TYPE_CACHE.set(type, d); return d;
    }
    async function fetchDefenseMultipliers(typeNames) {
      const mult = Object.fromEntries(ALL_TYPES.map(t => [t, 1]));
      for (const t of typeNames) {
        const d = await getTypeDetail(t); const rel = d.damage_relations || {};
        (rel.double_damage_from || []).forEach(x => mult[x.name] *= 2);
        (rel.half_damage_from || []).forEach(x => mult[x.name] *= 0.5);
        (rel.no_damage_from || []).forEach(x => mult[x.name] *= 0);
      } return mult;
    }

    async function getIdsForType(type) {
      if (TYPE_INDEX_CACHE.has(type)) return TYPE_INDEX_CACHE.get(type);
      const d = await fetch(`https://pokeapi.co/api/v2/type/${type}`).then(r => r.json());
      const ids = new Set((d.pokemon || []).map(p => getIdFromUrl(p.pokemon.url)).filter(Boolean));
      TYPE_INDEX_CACHE.set(type, ids); return ids;
    }
    async function getPokemonDetail(idOrUrl) {
      const id = typeof idOrUrl === 'string' && idOrUrl.startsWith('http') ? getIdFromUrl(idOrUrl) : Number(idOrUrl);
      if (DETAIL_CACHE.has(id)) return DETAIL_CACHE.get(id);
      const d = await fetch(typeof idOrUrl === 'string' && idOrUrl.startsWith('http') ? idOrUrl : `https://pokeapi.co/api/v2/pokemon/${id}`).then(r => r.json());
      const detail = {
        id: d.id, name: d.name,
        image: d.sprites?.other?.home?.front_default || homeUrl(d.id),
        spriteShiny: d.sprites?.other?.home?.front_shiny || homeShinyUrl(d.id) || d.sprites?.front_shiny || null,
        types: (d.types || []).map(t => t.type.name),
        stats: (d.stats || []).map(s => ({ name: s.stat.name, value: s.base_stat })),
        height: d.height, weight: d.weight,
        base_experience: d.base_experience,
        moves: d.moves || [],
        abilitiesFull: d.abilities || [], // keep slot + is_hidden
      };
      DETAIL_CACHE.set(d.id, detail); return detail;
    }
    async function getPokemonSpecies(id) {
      if (SPECIES_CACHE.has(id)) return SPECIES_CACHE.get(id);
      const d = await fetch(`https://pokeapi.co/api/v2/pokemon-species/${id}`).then(r => r.json());
      SPECIES_CACHE.set(id, d); return d;
    }
    async function getMoveDetail(url) {
      if (MOVE_CACHE.has(url)) return MOVE_CACHE.get(url);
      const d = await fetch(url).then(r => r.json());
      const out = { name: d.name, type: d.type?.name, accuracy: d.accuracy, power: d.power, damage_class: d.damage_class?.name };
      MOVE_CACHE.set(url, out); return out;
    }

    /* -------------------- Router por hash -------------------- */
    function parseRoute(hash) {
      const h = (hash || "").replace(/^#/, "");
      if (h === "" || h === "/") return { name: "home" };
      const m = h.match(/^\/?pokemon\/(\d+)\/?$/);
      if (m) return { name: "pokemon", id: Number(m[1]) };
      if (/^\/?torneo\/?$/.test(h)) return { name: "torneo" };
      return { name: "home" };
    }

    /* -------------------- App -------------------- */
    function App() {
      const [route, setRoute] = useState(() => parseRoute(location.hash));
      useEffect(() => { const onHash = () => setRoute(parseRoute(location.hash)); addEventListener("hashchange", onHash); return () => removeEventListener("hashchange", onHash); }, []);
      return (
        <div className="min-h-screen flex flex-col">
          <Header />
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 py-4 md:py-6">
            {route.name === "home" && <Pokedex />}
            {route.name === "pokemon" && <PokemonDetail id={route.id} />}
            {route.name === "torneo" && <Torneo />}
          </main>
          <Footer />
        </div>
      );
    }

    function Header() {
  return (
    <header
      className="sticky top-0 z-10"
      style={{ background: "linear-gradient(45deg,#F2CEEF,#DAE9F8,#FBE2D5,#D9D9D9,#C1F0C8,#F2F2F2)" }}
    >
      <div className="max-w-7xl mx-auto px-4 py-3 md:py-4 flex flex-wrap items-center gap-3">
        {/* Logo + título */}
        <a href="#/" className="inline-flex items-center gap-2 min-w-0">
          <div
            className="w-8 h-8 rounded-full grid place-items-center shrink-0"
            style={{ background: "linear-gradient(135deg,#D62828,#F77F00)" }}
          >
            <div className="w-3 h-3 rounded-full bg-[#003049]" />
          </div>

          {/* Tamaño fluido: se adapta de 24px a 40px */}
          <h1 className="font-extrabold leading-none text-[clamp(24px,7vw,40px)]">
            <span
              style={{
                fontWeight: 800,
                color: "#ffcb05",
                WebkitTextStroke: "2px #2a75bb",
                textShadow: "2px 2px 6px rgba(0,0,0,0.5)"
              }}
            >
              Poke
            </span>
            <span
              style={{
                fontWeight: 800,
                color: "#2a75bb",
                WebkitTextStroke: "1px #ffcb05",
                textShadow: "2px 2px 6px rgba(0,0,0,0.5)"
              }}
            >
              Rand
            </span>
            <span
              style={{
                fontWeight: 800,
                color: "#ffcb05",
                WebkitTextStroke: "2px #2a75bb",
                textShadow: "2px 2px 6px rgba(0,0,0,0.5)"
              }}
            >
              Up
            </span>
          </h1>
        </a>

        {/* Navegación: pasa a la segunda línea y se alinea a la derecha en móvil */}
        <div className="ml-auto w-full sm:w-auto flex items-center gap-2 justify-end">
          <a
            href="#/torneo"
            className="rounded-full px-3 py-1 border border-gray-300 hover:bg-white/60 text-sm whitespace-nowrap"
          >
            Torneo
          </a>
          <a
            href="#/"
            className="rounded-full px-3 py-1 border border-gray-300 hover:bg-white/60 text-sm whitespace-nowrap"
          >
            Pokédex
          </a>
        </div>
      </div>
    </header>
  );
}


    function Footer() {
      return (
        <footer className="mt-6" style={{ background: "linear-gradient(45deg,#F2CEEF,#DAE9F8,#FBE2D5,#D9D9D9,#C1F0C8,#F2F2F2)" }}>
          <div className="max-w-7xl mx-auto px-4 py-5 text-xs text-gray-700">
            <p>Esta aplicación ha sido desarrollada principalmente con la asistencia de ChatGPT (94%), junto con aportes de SotoR713 (2%), CeszarW (2%) y Manuel (2%), con fines exclusivamente recreativos y educativos. No está afiliada oficialmente a Pokémon ni a Nintendo. El uso comercial está prohibido.</p>
            <p className="text-gray-600 mt-1">© 2025 PokeRandup</p>
          </div>
        </footer>
      );
    }

    /* -------------------- Home / Pokedex (igual que tu base) -------------------- */
    function Pokedex() {
      const PAGE_SIZE_OPTIONS = [24, 48, 72, 120, 200, 300, 500, 1000, 1500];
      const [pageSize, setPageSize] = useState(48);
      const [page, setPage] = useState(1);
      const [totalCount, setTotalCount] = useState(0);
      const [items, setItems] = useState([]);
      const [listLoading, setListLoading] = useState(false);
      const [error, setError] = useState("");

      // search + filters
      const [query, setQuery] = useState("");
      const [nameIndex, setNameIndex] = useState([]); // {id,name,url}
      const [suggestions, setSuggestions] = useState([]);
      const [typeFilter, setTypeFilter] = useState([]);
      const [genFilter, setGenFilter] = useState('all');
      const [sortKey, setSortKey] = useState('id');
      const [sortDir, setSortDir] = useState('asc');
      const debounceRef = useRef(null);

      const isFiltering = typeFilter.length > 0 || genFilter !== 'all';

      useEffect(() => { // build index + count
        let cancel = false;
        (async () => {
          try {
            const r = await fetch("https://pokeapi.co/api/v2/pokemon?limit=1").then(x => x.json());
            if (!cancel) setTotalCount(r.count || 1025);
          } catch { if (!cancel) setTotalCount(1025); }
          try {
            const all = await fetch("https://pokeapi.co/api/v2/pokemon?limit=20000").then(x => x.json());
            const idx = (all.results || []).map(p => ({ name: p.name, id: getIdFromUrl(p.url), url: p.url })).filter(x => x.id);
            if (!cancel) setNameIndex(idx);
          } catch { }
        })();
        return () => { cancel = true };
      }, []);

      const maxPage = Math.max(1, Math.ceil((totalCount || 1) / (isFiltering ? (totalCount || 1) : pageSize)));

      // Unfiltered page
      useEffect(() => {
        if (!totalCount || isFiltering) return;
        let cancel = false; setListLoading(true); setError("");
        const url = `https://pokeapi.co/api/v2/pokemon?limit=${pageSize}&offset=${(page - 1) * pageSize}`;
        (async () => {
          try {
            const base = await fetch(url).then(r => r.json());
            const details = await Promise.all((base.results || []).map(it => getPokemonDetail(it.url)));
            if (!cancel) setItems(details);
          } catch { if (!cancel) setError("No se pudo cargar la lista."); }
          finally { if (!cancel) setListLoading(false); }
        })();
        return () => { cancel = true };
      }, [totalCount, page, pageSize, isFiltering]);

      // Filtered (no pagination)
      useEffect(() => {
        if (!isFiltering || nameIndex.length === 0) return;
        let cancel = false; setListLoading(true); setError("");
        (async () => {
          try {
            let ids = nameIndex.map(x => x.id);
            if (typeFilter.length) {
              const sets = await Promise.all(typeFilter.map(t => getIdsForType(t)));
              let inter = new Set(sets[0]); for (let i = 1; i < sets.length; i++) inter = new Set([...inter].filter(id => sets[i].has(id)));
              ids = ids.filter(id => inter.has(id));
            }
            if (genFilter !== 'all') {
              const [a, b] = rangeForGen(genFilter);
              ids = ids.filter(id => id >= a && id <= b);
            }
            // fetch details + search fuzzy
            const nq = normalize(query);
            let det = await Promise.all(ids.map(id => getPokemonDetail(id)));
            if (nq) det = det.filter(d => normalize(d.name).includes(nq) || String(d.id) === nq);
            // sort
            det.sort((a, b) => {
              if (sortKey === 'name') { const c = a.name.localeCompare(b.name); return sortDir === 'asc' ? c : -c; }
              const map = { id: [a.id, b.id], bst: [a.stats.reduce((s, x) => s + x.value, 0), b.stats.reduce((s, x) => s + x.value, 0)], exp: [a.base_experience, b.base_experience] };
              const [va, vb] = map[sortKey]; const c = va - vb; return sortDir === 'asc' ? c : -c;
            });
            if (!cancel) setItems(det);
          } catch { if (!cancel) setError("No se pudo cargar la lista filtrada."); }
          finally { if (!cancel) setListLoading(false); }
        })();
        return () => { cancel = true };
      }, [isFiltering, nameIndex, typeFilter, genFilter, sortKey, sortDir, query]);

      // suggestions
      useEffect(() => {
        clearTimeout(debounceRef.current);
        if (!query) { setSuggestions([]); return; }
        debounceRef.current = setTimeout(() => {
          const nq = normalize(query);
          setSuggestions(nameIndex.filter(p => normalize(p.name).includes(nq) || String(p.id) === nq).slice(0, 10));
        }, 180);
        return () => clearTimeout(debounceRef.current);
      }, [query, nameIndex]);

      function toggleType(t) { setTypeFilter(prev => prev.includes(t) ? prev.filter(x => x !== t) : [...prev, t]); }
      function clearFilters() { setTypeFilter([]); setGenFilter('all'); setSortKey('id'); setSortDir('asc'); }
      const goPage = (p) => setPage(prev => Math.min(Math.max(1, p), maxPage));

      return (
        <>
          {/* Equipo compacto */}
          <TeamLite />

          {/* Buscador */}
          <section className="mb-4 bg-white rounded-2xl shadow p-3 md:p-4 relative">
            <form className="flex flex-col md:flex-row gap-2 md:items-center" onSubmit={(e) => e.preventDefault()}>
              <div className="relative flex-1 md:w-96">
                <input className="w-full px-3 py-2 rounded-xl border border-gray-300 outline-none focus:ring-2 focus:ring-[#2a75bb]"
                  placeholder="Buscar por nombre o ID (ej. pikachu, 25)" value={query} onChange={e => setQuery(e.target.value)} />
                {suggestions.length > 0 && (
                  <div className="absolute z-20 mt-1 w-full bg-white border border-gray-200 rounded-xl shadow max-h-60 overflow-auto">
                    {suggestions.map(s => (
                      <a key={s.id} href={`#/pokemon/${s.id}`} className="block px-3 py-2 hover:bg-gray-50 text-sm flex justify-between">
                        <span className="capitalize">{titleCase(s.name)}</span><span className="text-gray-500">#{s.id}</span>
                      </a>
                    ))}
                  </div>
                )}
              </div>
            </form>
          </section>

          {/* Filtros */}
          <section className="mb-4 bg-white rounded-2xl shadow p-3 md:p-4">
            <div className="flex items-center justify-between flex-wrap gap-2">
              <h3 className="font-semibold">Filtrar por tipo</h3>
              <button onClick={clearFilters} className="text-sm px-3 py-1 rounded-lg border hover:bg-gray-50">Limpiar filtros</button>
            </div>
            <div className="mt-2 flex flex-wrap gap-2">
              {ALL_TYPES.map(t => {
                const active = typeFilter.includes(t); const color = TYPE_COLORS[t];
                return (
                  <button key={t} onClick={() => toggleType(t)}
                    className={`px-2.5 py-1 rounded-full text-xs font-medium border transition ${active ? 'text-white' : 'text-gray-800'}`}
                    style={{ backgroundColor: active ? color : 'transparent', borderColor: color }}>{TYPE_ES[t]}</button>
                );
              })}
            </div>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-3 mt-3">
              <div className="flex items-center gap-2">
                <span className="text-sm text-gray-600">Generación:</span>
                <select value={genFilter} onChange={e => setGenFilter(e.target.value)} className="px-3 py-2 rounded-xl border border-gray-300">
                  <option value="all">Todas</option>
                  {GENERATIONS.map(g => <option key={g.key} value={g.key}>{g.label}</option>)}
                </select>
              </div>
              <div className="flex items-center gap-2">
                <span className="text-sm text-gray-600">Ordenar por:</span>
                <select value={sortKey} onChange={e => setSortKey(e.target.value)} className="px-3 py-2 rounded-xl border border-gray-300">
                  <option value="id">ID</option>
                  <option value="name">Nombre</option>
                  <option value="bst">BST</option>
                  <option value="exp">EXP base</option>
                </select>
              </div>
              <div className="flex items-center gap-2">
                <span className="text-sm text-gray-600">Dirección:</span>
                <select value={sortDir} onChange={e => setSortDir(e.target.value)} className="px-3 py-2 rounded-xl border border-gray-300">
                  <option value="asc">Ascendente</option>
                  <option value="desc">Descendente</option>
                </select>
              </div>
            </div>
          </section>

          {/* Paginación (desactivada con filtros) */}
          {!isFiltering && (
            <section className="mb-4 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
              <div className="flex items-center gap-2">
                <span className="text-sm text-gray-600">Por página:</span>
                <select className="h-10 px-3 rounded-xl border border-gray-300" value={pageSize} onChange={e => { setPageSize(+e.target.value); setPage(1); }}>
                  {PAGE_SIZE_OPTIONS.map(n => <option key={n} value={n}>{n}</option>)}
                </select>
              </div>
              <div className="flex items-center gap-2 justify-end">
                <button onClick={() => goPage(1)} className="h-10 px-3 rounded-xl border border-gray-300 hover:bg-gray-100" disabled={page === 1}>«</button>
                <button onClick={() => goPage(page - 1)} className="h-10 px-3 rounded-xl border border-gray-300 hover:bg-gray-100" disabled={page === 1}>‹</button>
                <span className="h-10 px-3 inline-flex items-center text-sm">Página <b className="mx-1">{page}</b> de <b>{maxPage}</b></span>
                <button onClick={() => goPage(page + 1)} className="h-10 px-3 rounded-xl border border-gray-300 hover:bg-gray-100" disabled={page === maxPage}>›</button>
                <button onClick={() => goPage(maxPage)} className="h-10 px-3 rounded-xl border border-gray-300 hover:bg-gray-100" disabled={page === maxPage}>»</button>
              </div>
            </section>
          )}
          {isFiltering && <p className="mb-4 text-center text-sm text-gray-600">Paginación desactivada al aplicar filtros. Mostrando {items.length} resultados.</p>}

          {/* Lista */}
          <section className="rounded-2xl bg-white shadow p-3 md:p-4">
            {error && <div className="mb-4 p-3 rounded-xl bg-red-50 border border-red-200 text-red-700">{error}</div>}
            {listLoading ? (
              <div className="py-8 text-center animate-pulse">Cargando Pokédex…</div>
            ) : (
              <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 xl:grid-cols-8 gap-3 md:gap-4">
                {items.map(it => <PokemonCard key={it.id} data={it} />)}
              </div>
            )}
          </section>
        </>
      );
    }

    function TeamLite() {
      const [team, setTeam] = useState(() => { try { return JSON.parse(localStorage.getItem("pokerandup_team") || "[]"); } catch { return []; } });
      const [summary, setSummary] = useState(null);

      useEffect(() => { try { localStorage.setItem("pokerandup_team", JSON.stringify(team)); } catch { } }, [team]);
      useEffect(() => {
        let cancel = false;
        (async () => {
          const counts = { weak: Object.fromEntries(ALL_TYPES.map(t => [t, 0])), resist: Object.fromEntries(ALL_TYPES.map(t => [t, 0])), immune: Object.fromEntries(ALL_TYPES.map(t => [t, 0])) };
          for (const m of team) {
            const mult = await fetchDefenseMultipliers(m.types);
            for (const t of ALL_TYPES) {
              const v = mult[t];
              if (v === 0) counts.immune[t]++; else if (v > 1) counts.weak[t]++; else if (v < 1) counts.resist[t]++;
            }
          }
          if (!cancel) setSummary(counts);
        })();
        return () => { cancel = true };
      }, [team]);

      function remove(id) { setTeam(prev => prev.filter(x => x.id !== id)); }
      function clear() { setTeam([]); }

      const teamLen = team.length;
      const danger = useMemo(() => {
        if (!summary || teamLen === 0) return [];
        const thr = Math.ceil(teamLen / 2);
        return ALL_TYPES.map(t => ({ t, count: summary.weak[t] })).filter(x => x.count >= thr).sort((a, b) => b.count - a.count);
      }, [summary, teamLen]);

      return (
        <section className="mb-4 bg-white rounded-2xl shadow p-3 md:p-4">
          <div className="flex items-center justify-between">
            <h2 className="text-lg font-semibold">Mi equipo ({teamLen}/6)</h2>
            <button onClick={clear} className="px-3 py-1.5 rounded-xl border border-gray-300 hover:bg-gray-100 text-sm">Limpiar equipo</button>
          </div>
          <div className="mt-3 grid grid-cols-3 sm:grid-cols-6 gap-3">
            {Array.from({ length: 6 }).map((_, i) => {
              const m = team[i]; const color = m ? (TYPE_COLORS[m.types[0]] || "#ddd") : "#e5e7eb";
              return (
                <div key={i} className={`relative aspect-square rounded-xl border overflow-hidden grid place-items-center ${m ? "" : "text-gray-400 border-dashed"}`}
                  style={{ borderColor: color, backgroundColor: m ? `${color}22` : "transparent" }}>
                  {m ? (
                    <>
                      <img src={homeUrl(m.id)} onError={e => e.currentTarget.src = defaultSpriteById(m.id)} className="w-full h-full object-contain p-2" alt="" />
                      <div className="absolute bottom-1 left-1 right-1 flex items-center justify-between text-[11px]">
                        <span className="px-1.5 py-0.5 rounded text-white" style={{ backgroundColor: color }}>{titleCase(m.name)}</span>
                        <button onClick={() => remove(m.id)} className="px-1.5 py-0.5 rounded bg-white/90 border">Quitar</button>
                      </div>
                    </>
                  ) : <span>Vacío</span>}
                </div>
              );
            })}
          </div>
          {danger.length > 0 && (
            <div className="mt-3 text-sm">Atención: debilidad alta a{" "}
              <span className="inline-flex flex-wrap gap-1">{danger.slice(0, 4).map(x => <TypeBadge key={x.t} type={x.t} />)}</span>
            </div>
          )}
        </section>
      );
    }

    function PokemonCard({ data }) {
      const { id, name, image, types = [], base_experience, height, weight, stats = [] } = data;
      const color = TYPE_COLORS[types[0] || 'normal'] || "#ddd";

      function addQuick(e) {
        e.preventDefault(); e.stopPropagation();
        try {
          const team = JSON.parse(localStorage.getItem("pokerandup_team") || "[]");
          if (team.find(x => x.id === id) || team.length >= 6) return;
          const entry = { id, name, image: image || homeUrl(id), types };
          localStorage.setItem("pokerandup_team", JSON.stringify([...team, entry]));
        } catch { }
      }

      return (
        <a href={`#/pokemon/${id}`} className="group relative overflow-hidden rounded-2xl border bg-white hover:shadow-md transition" style={{ borderColor: color }}>
          {/* Botón + circular */}
          <button onClick={addQuick} title="Añadir al equipo"
            className="absolute top-2 right-2 z-10 w-8 h-8 rounded-full grid place-items-center text-white font-bold shadow"
            style={{ backgroundColor: color }}>+</button>

          <div className="aspect-square grid place-items-center p-2" style={{ backgroundColor: `${color}22` }}>
            <img src={image || homeUrl(id)} onError={e => e.currentTarget.src = defaultSpriteById(id)} loading="lazy" className="max-h-40 object-contain" alt="" />
          </div>
          <div className="p-3">
            <div className="flex items-center justify-between">
              <div className="text-[10px] tracking-widest text-gray-500">#{String(id).padStart(4, "0")}</div>
              <div className="text-[10px] font-semibold" style={{ color }}>BST {stats.reduce((s, x) => s + x.value, 0)}</div>
            </div>
            <div className="font-semibold text-gray-900 flex items-center gap-2">
              <span className="capitalize">{titleCase(name)}</span>
              <span className="text-[10px] px-1.5 py-0.5 rounded bg-gray-100 text-gray-600">EXP {base_experience}</span>
            </div>
            <div className="mt-1 flex flex-wrap gap-1">
              {types.map(t => <TypeBadge key={t} type={t} />)}
            </div>
            <div className="mt-2 text-[11px] text-gray-600 flex items-center gap-3">
              <span className="inline-flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full" style={{ backgroundColor: color }}></span>{(data.abilitiesFull || []).length || 0} hab.</span>
              <span className="inline-flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-gray-300"></span>{(height || 0) / 10} m</span>
              <span className="inline-flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-gray-500"></span>{(weight || 0) / 10} kg</span>
            </div>
          </div>
        </a>
      );
    }

    /* -------------------- Detalle -------------------- */
    function PokemonDetail({ id }) {
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState("");
      const [p, setP] = useState(null);
      const [species, setSpecies] = useState(null);
      const [defense, setDefense] = useState(null);
      const [showShiny, setShowShiny] = useState(false);

      // Evolución (árbol)
      const [evoTree, setEvoTree] = useState(null);

      // Habilidades enriquecidas
      const [abilityInfos, setAbilityInfos] = useState([]);

      // Movimientos
      const [activeTab, setActiveTab] = useState("stats"); // stats | types | evo | abilities | moves
      const [movesRows, setMovesRows] = useState([]);
      const [movesLoading, setMovesLoading] = useState(false);
      const [mvType, setMvType] = useState("any");
      const [mvCat, setMvCat] = useState("any");
      const [mvPower, setMvPower] = useState("");
      const [mvAcc, setMvAcc] = useState("");
      const [mvVer, setMvVer] = useState("any");
      const [mvQuery, setMvQuery] = useState("");

      useEffect(() => {
        let cancel = false;
        (async () => {
          try {
            setLoading(true); setError("");
            const d = await getPokemonDetail(id); if (cancel) return;
            setP(d);
            const sp = await getPokemonSpecies(d.id); if (cancel) return;
            setSpecies(sp);

            // defensa
            const mult = await fetchDefenseMultipliers(d.types); if (cancel) return; setDefense(mult);

            // habilidades (con slot/hidden)
            const enriched = await Promise.all((d.abilitiesFull || []).map(async (ab) => {
              try {
                const data = await fetch(ab.ability.url).then(r => r.json());
                const name_en = (data.names || []).find(n => n.language?.name === "en")?.name || data.name;
                const name_es = (data.names || []).find(n => n.language?.name === "es")?.name || name_en;
                const flavor_es = (data.flavor_text_entries || []).find(e => e.language?.name === "es")?.flavor_text;
                const effect_en = (data.effect_entries || []).find(e => e.language?.name === "en")?.short_effect || (data.effect_entries || []).find(e => e.language?.name === "en")?.effect;
                const description = (flavor_es || effect_en || "—").replace(/\s+/g, " ");
                return { slot: ab.slot, is_hidden: ab.is_hidden, name_es, name_en, description };
              } catch { return { slot: ab.slot, is_hidden: ab.is_hidden, name_es: ab.ability.name, name_en: ab.ability.name, description: "—" }; }
            }));
            // ordenar por slot (1,2) y ocultas al final
            enriched.sort((a, b) => {
              if (a.is_hidden !== b.is_hidden) return a.is_hidden ? 1 : -1;
              return (a.slot || 99) - (b.slot || 99);
            });
            if (!cancel) setAbilityInfos(enriched);

            // Evolución -> árbol
            const evoUrl = sp.evolution_chain?.url;
            if (evoUrl) {
              const chain = await fetch(evoUrl).then(r => r.json());
              const tree = toEvoTree(chain.chain);
              if (!cancel) setEvoTree(tree);
            } else setEvoTree(null);

          } catch { if (!cancel) setError("No se pudo cargar el Pokémon."); }
          finally { if (!cancel) setLoading(false); }
        })();
        return () => { cancel = true };
      }, [id]);

      // MOVES: cargar al abrir tab
      useEffect(() => {
        if (activeTab !== "moves" || !p) return;
        let cancel = false;
        (async () => {
          try {
            setMovesLoading(true);
            const rows = await Promise.all((p.moves || []).slice(0, 200).map(async mv => {
              const d = await getMoveDetail(mv.move.url);
              const vg = (mv.version_group_details || []).slice(-1)[0] || mv.version_group_details?.[0];
              return { name: d.name, type: d.type, accuracy: d.accuracy, power: d.power, category: d.damage_class, method: vg?.move_learn_method?.name, level: vg?.level_learned_at ?? null, version: vg?.version_group?.name };
            }));
            if (!cancel) setMovesRows(rows);
          } finally { if (!cancel) setMovesLoading(false); }
        })();
        return () => { cancel = true };
      }, [activeTab, p]);

      const filteredMoves = useMemo(() => {
        return movesRows.filter(r => {
          if (mvType !== "any" && r.type !== mvType) return false;
          if (mvCat !== "any" && r.category !== mvCat) return false;
          if (mvVer !== "any" && (r.version || "") !== mvVer) return false;
          if (mvPower && (r.power ?? 0) < Number(mvPower)) return false;
          if (mvAcc && (r.accuracy ?? 0) < Number(mvAcc)) return false;
          if (mvQuery && !normalize(r.name).includes(normalize(mvQuery))) return false;
          return true;
        }).sort((a, b) => (b.level ?? 0) - (a.level ?? 0));
      }, [movesRows, mvType, mvCat, mvPower, mvAcc, mvVer, mvQuery]);

      if (loading) return <div className="py-16 text-center animate-pulse">Cargando…</div>;
      if (error) return <div className="p-4 rounded-2xl bg-red-50 border border-red-200 text-red-700">{error}</div>;
      if (!p) return null;

      const pid = p.id, name = p.name, types = p.types || [];
      const heightM = p.height / 10, weightKg = p.weight / 10;
      const defWeak = [], defResist = [], defImmune = [];
      if (defense) {
        for (const t of ALL_TYPES) {
          const m = defense[t]; if (m === 0) defImmune.push([t, m]); else if (m > 1) defWeak.push([t, m]); else if (m < 1) defResist.push([t, m]);
        }
        defWeak.sort((a, b) => b[1] - a[1]); defResist.sort((a, b) => a[1] - b[1]);
      }

      // NAV next/prev ids simples
      const prevId = Math.max(1, pid - 1), nextId = pid + 1;

      return (
        <div className="grid grid-cols-1 xl:grid-cols-5 gap-6 relative">
          {/* Izquierda: ficha + shiny */}
          <section className="xl:col-span-2 rounded-2xl bg-white shadow p-4 flex flex-col gap-4">
            <div className="flex items-start justify-between">
              <div>
                <div className="text-sm text-gray-500">#{String(pid).padStart(4, "0")}</div>
                <h2 className="text-2xl font-extrabold capitalize">{titleCase(name)}</h2>
                <div className="mt-2 flex flex-wrap gap-2">
                  {types.map(t => <TypeBadge key={t} type={t} />)}
                </div>
              </div>
              <div className="text-right text-sm text-gray-600">
                <div><b>Altura:</b> {heightM} m</div>
                <div><b>Peso:</b> {weightKg} kg</div>
              </div>
            </div>

            <div className="grid place-items-center rounded-xl" style={{ background: "linear-gradient(135deg,#ffffff,#f5f7ff)" }}>
              <img
                src={showShiny && p.spriteShiny ? p.spriteShiny : p.image}
                onError={e => e.currentTarget.src = defaultSpriteById(pid)}
                className="w-full max-w-md object-contain"
                alt=""
              />
            </div>

            <div className="flex items-center justify-between">
              <button onClick={() => addToTeamFromDetail(p)} className="px-4 py-2 rounded-xl text-white" style={{ backgroundColor: TYPE_COLORS[types[0]] || "#003049" }}>Añadir al equipo</button>
              <label className={`inline-flex items-center gap-2 text-sm ${p.spriteShiny ? '' : 'opacity-60'}`}>
                <input type="checkbox" disabled={!p.spriteShiny} checked={!!(showShiny && p.spriteShiny)} onChange={() => setShowShiny(s => !s)} />
                <span>⭐ Shiny</span>
              </label>
            </div>
          </section>

          {/* Derecha: Tabs */}
          <section className="xl:col-span-3 rounded-2xl bg-white shadow p-0">
            <div role="tablist" className="flex overflow-x-auto border-b border-gray-200">
              {[
                ["stats", "Estadísticas base"],
                ["types", "Fortalezas y Debilidades"],
                ["evo", "Línea evolutiva"],
                ["abilities", "Habilidades"],
                ["moves", "Movimientos"],
              ].map(([k, label]) => (
                <button key={k} role="tab" aria-selected={activeTab === k}
                  onClick={() => setActiveTab(k)}
                  className={`px-4 py-3 text-sm font-medium whitespace-nowrap ${activeTab === k ? "text-[#2a75bb] border-b-2 border-[#2a75bb]" : "text-gray-600 hover:text-gray-900"}`}>{label}</button>
              ))}
            </div>

            <div className="p-4">
              {/* Stats */}
              {activeTab === "stats" && (
                <div className="space-y-2">
                  {p.stats.map(s => (
                    <div key={s.name} className="grid grid-cols-5 gap-2 items-center">
                      <div className="col-span-2 text-sm font-medium text-gray-700">{titleCase(s.name.replace(/-/g, " "))}</div>
                      <div className="col-span-2 h-3 bg-gray-100 rounded"><div className="h-3 rounded" style={{ width: `${Math.min(100, (s.value / 180) * 100)}%`, background: "linear-gradient(90deg,#003049,#F77F00)" }}></div></div>
                      <div className="text-sm text-gray-800 font-semibold tabular-nums text-right">{s.value}</div>
                    </div>
                  ))}
                </div>
              )}

              {/* Fortalezas y Debilidades (solo DEFENSA) */}
              {activeTab === "types" && (
                <div className="space-y-3">
                  <div>
                    <h4 className="text-sm font-semibold mb-1">Debilidades</h4>
                    {defWeak.length === 0 ? <p className="text-sm text-gray-600">Ninguna</p> :
                      <div className="flex flex-wrap gap-2">{defWeak.map(([t, m]) => <TypeBadge key={`w-${t}`} type={t} label={`${TYPE_ES[t]} x${m}`} />)}</div>}
                  </div>
                  <div>
                    <h4 className="text-sm font-semibold mb-1">Resistencias</h4>
                    {defResist.length === 0 ? <p className="text-sm text-gray-600">Ninguna</p> :
                      <div className="flex flex-wrap gap-2">{defResist.map(([t, m]) => <TypeBadge key={`r-${t}`} type={t} label={`${TYPE_ES[t]} x${m}`} />)}</div>}
                  </div>
                  <div>
                    <h4 className="text-sm font-semibold mb-1">Inmunidades</h4>
                    {defImmune.length === 0 ? <p className="text-sm text-gray-600">Ninguna</p> :
                      <div className="flex flex-wrap gap-2">{defImmune.map(([t]) => <TypeBadge key={`i-${t}`} type={t} label={`${TYPE_ES[t]} x0`} />)}</div>}
                  </div>
                </div>
              )}

              {/* Línea evolutiva */}
              {activeTab === "evo" && (
                <EvolutionView tree={evoTree} />
              )}

              {/* Habilidades */}
              {activeTab === "abilities" && (
                <div className="grid gap-3">
                  {abilityInfos.length === 0 ? (
                    <p className="text-sm text-gray-600">—</p>
                  ) : abilityInfos.map((ab, i) => {
                    const label = ab.is_hidden ? "Habilidad oculta" : (`Habilidad ${ab.slot || i}`);
                    return (
                      <div key={i} className="p-3 rounded-xl border border-gray-200">
                        <div className="font-semibold">{label}: {ab.name_es} <span className="text-gray-500">({ab.name_en})</span></div>
                        <div className="text-gray-700 leading-snug">{ab.description}</div>
                      </div>
                    );
                  })}
                </div>
              )}

              {/* Movimientos */}
              {activeTab === "moves" && (
                <div>
                  <h3 className="font-semibold mb-3">Filtrar movimientos</h3>
                  <div className="grid grid-cols-1 md:grid-cols-6 gap-2 mb-3">
                    <input value={mvQuery} onChange={e => setMvQuery(e.target.value)} className="px-3 py-2 rounded-xl border border-gray-300" placeholder="Movimiento" />
                    <select value={mvType} onChange={e => setMvType(e.target.value)} className="px-3 py-2 rounded-xl border border-gray-300">
                      <option value="any">Cualquiera (tipo)</option>
                      {ALL_TYPES.map(ty => <option key={ty} value={ty}>{TYPE_ES[ty]}</option>)}
                    </select>
                    <select value={mvCat} onChange={e => setMvCat(e.target.value)} className="px-3 py-2 rounded-xl border border-gray-300">
                      <option value="any">Cualquiera (cat.)</option>
                      <option value="physical">Físico</option>
                      <option value="special">Especial</option>
                      <option value="status">Estado</option>
                    </select>
                    <input type="number" min="0" value={mvPower} onChange={e => setMvPower(e.target.value)} className="px-3 py-2 rounded-xl border border-gray-300" placeholder="Poder mín." />
                    <input type="number" min="0" value={mvAcc} onChange={e => setMvAcc(e.target.value)} className="px-3 py-2 rounded-xl border border-gray-300" placeholder="Precisión mín." />
                    <select value={mvVer} onChange={e => setMvVer(e.target.value)} className="px-3 py-2 rounded-xl border border-gray-300">
                      <option value="any">Cualquier versión</option>
                      {[...new Set(movesRows.map(r => r.version).filter(Boolean))].sort().map(v => <option key={v} value={v}>{v.replace(/-/g, " ")}</option>)}
                    </select>
                  </div>

                  {movesLoading ? (
                    <div className="py-6 text-center animate-pulse">Cargando movimientos…</div>
                  ) : (
                    <div className="overflow-auto rounded-lg border border-gray-200">
                      <table className="min-w-full text-sm">
                        <thead className="bg-gray-50">
                          <tr className="text-left">
                            <th className="px-3 py-2">Movimiento</th>
                            <th className="px-3 py-2">Tipo</th>
                            <th className="px-3 py-2">Categoría</th>
                            <th className="px-3 py-2">Poder</th>
                            <th className="px-3 py-2">Precisión</th>
                            <th className="px-3 py-2">Método</th>
                            <th className="px-3 py-2">Nivel</th>
                            <th className="px-3 py-2">Versión</th>
                          </tr>
                        </thead>
                        <tbody>
                          {filteredMoves.map((r, i) => (
                            <tr key={`${r.name}-${i}`} className={i % 2 ? "bg-white" : "bg-gray-50/60"}>
                              <td className="px-3 py-2 capitalize">{r.name.replace(/-/g, " ")}</td>
                              <td className="px-3 py-2"><TypeBadge type={r.type || "normal"} /></td>
                              <td className="px-3 py-2 capitalize">{r.category || "—"}</td>
                              <td className="px-3 py-2">{r.power ?? "—"}</td>
                              <td className="px-3 py-2">{r.accuracy ?? "—"}</td>
                              <td className="px-3 py-2 capitalize">{(r.method || "—").replace(/-/g, " ")}</td>
                              <td className="px-3 py-2">{r.level ?? "—"}</td>
                              <td className="px-3 py-2 capitalize">{(r.version || "—").replace(/-/g, " ")}</td>
                            </tr>
                          ))}
                          {filteredMoves.length === 0 && <tr><td colSpan="8" className="px-3 py-4 text-center text-gray-500">—</td></tr>}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>
              )}
            </div>
          </section>

          {/* Prev / Next flotantes */}
          <a href={`#/pokemon/${prevId}`} className="fixed bottom-4 right-20 w-10 h-10 rounded-full grid place-items-center bg-white shadow border hover:bg-gray-50" title="Anterior">‹</a>
          <a href={`#/pokemon/${nextId}`} className="fixed bottom-4 right-4 w-10 h-10 rounded-full grid place-items-center bg-[#2a75bb] text-white shadow hover:opacity-90" title="Siguiente">›</a>
        </div>
      );
    }

    function addToTeamFromDetail(p) {
      try {
        const team = JSON.parse(localStorage.getItem("pokerandup_team") || "[]");
        if (team.find(x => x.id === p.id) || team.length >= 6) return;
        const entry = { id: p.id, name: p.name, image: p.image || homeUrl(p.id), types: p.types || [] };
        localStorage.setItem("pokerandup_team", JSON.stringify([...team, entry]));
      } catch { }
    }

    /* -------- Evolución: helpers + vistas responsivas -------- */
    function toEvoTree(node) { // convierte el JSON de PokeAPI a árbol sencillo
      const sid = getIdFromUrl(node.species?.url);
      return {
        id: sid, name: node.species?.name,
        children: (node.evolves_to || []).map(ch => ({
          via: ch.evolution_details || [],
          node: toEvoTree(ch)
        }))
      };
    }
    function evoChips(details) {
      const d = details?.[0] || {};
      const chips = [];
      if (d.min_level) chips.push(`Nivel ${d.min_level}`);
      if (d.time_of_day) chips.push(d.time_of_day === "day" ? "Día" : "Noche");
      if (d.item?.name) chips.push(`Piedra: ${titleCase(d.item.name.replace(/-/g, " "))}`);
      if (d.trigger?.name === "trade") chips.push("Intercambio");
      if (d.friendship) chips.push(`Amistad ≥ ${d.friendship}`);
      if (d.gender === 1) chips.push("Género: ♀");
      if (d.gender === 2) chips.push("Género: ♂");
      if (d.known_move_type?.name) chips.push(`Con mov. ${titleCase(d.known_move_type.name)}`);
      if (d.location?.name) chips.push(titleCase(d.location.name.replace(/-/g, " ")));
      return chips;
    }

    function EvolutionView({ tree }) {
      if (!tree) return <p className="text-sm text-gray-600">No disponible.</p>;

      // Desktop: columnas por nivel
      const levels = []; (function walk(n, depth = 0) {
        (levels[depth] ??= []).push(n);
        (n.children || []).forEach(ch => walk(ch.node, depth + 1));
      })(tree);

      return (
        <>
          {/* Móvil */}
          <div className="md:hidden">
            <EvoMobile node={tree} />
          </div>

          {/* Escritorio */}
          <div className="hidden md:grid" style={{ gridTemplateColumns: `repeat(${levels.length}, minmax(0,1fr))` }}>
            {levels.map((col, idx) => (
              <div key={idx} className="min-h-[260px] flex flex-col gap-8 justify-center items-center">
                {col.map(n => (
                  <div key={n.id} className="flex flex-col items-center gap-2">
                    <div className="flex items-center gap-3">
                      {idx > 0 && (
                        <svg className="w-6 h-6 text-[#2a75bb] opacity-70" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M9 6l6 6-6 6" /></svg>
                      )}
                      <EvoNode id={n.id} name={n.name} />
                    </div>
                    {idx > 0 && (
                      <div className="flex flex-wrap gap-1 justify-center">
                        {findIncomingChips(tree, n.id).map((c, i) => <span key={i} className="px-2 py-0.5 text-[11px] rounded bg-gray-100 border">{c}</span>)}
                      </div>
                    )}
                  </div>
                ))}
              </div>
            ))}
          </div>
        </>
      );
    }
    function findIncomingChips(root, targetId) {
      let res = [];
      (function dfs(n) {
        for (const ch of (n.children || [])) {
          if (ch.node.id === targetId) { res = evoChips(ch.via); return; }
          dfs(ch.node);
        }
      })(root);
      return res;
    }
    function EvoMobile({ node }) {
      return (
        <div className="flex flex-col items-center text-center">

    /* 🎊 Confeti minimalista (canvas + requestAnimationFrame) */
    function confettiBurst({
      x = innerWidth / 2,
      y = innerHeight / 4,
      particles = 140,
      spread = 90,
      decay = 0.89,
      scalar = 1
    } = {}) {
      const c = document.createElement('canvas');
      Object.assign(c.style, {
        position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 9999
      });
      document.body.appendChild(c);
      const g = c.getContext('2d');
      const resize = () => { c.width = innerWidth; c.height = innerHeight; };
      resize();
      const toRad = Math.PI / 180;
      const colors = ['#ffcb05', '#2a75bb', '#f59e0b', '#10b981', '#ef4444', '#3b82f6'];
      const parts = Array.from({ length: particles }, () => ({
        x, y,
        angle: (-spread / 2) + Math.random() * spread,
        v: 8 + Math.random() * 6,
        size: (4 + Math.random() * 6) * scalar,
        rot: Math.random() * 360,
        rotSpd: (Math.random() * 20 - 10),
        color: colors[(Math.random() * colors.length) | 0],
        alpha: 1
      }));
      const gravity = 0.25, drag = 0.005;
      function frame() {
        g.clearRect(0, 0, c.width, c.height);
        for (let i = parts.length - 1; i >= 0; i--) {
          const p = parts[i];
          p.v *= 1 - drag;
          p.x += Math.cos(p.angle * toRad) * p.v;
          p.y += Math.sin(p.angle * toRad) * p.v + gravity;
          p.rot += p.rotSpd;
          p.alpha *= decay;
          if (p.alpha <= 0.02 || p.y > c.height + 20) { parts.splice(i, 1); continue; }
          g.save();
          g.globalAlpha = p.alpha;
          g.translate(p.x, p.y);
          g.rotate(p.rot * toRad);
          g.fillStyle = p.color;
          g.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          g.restore();
        }
        if (parts.length) requestAnimationFrame(frame);
        else c.remove();
      }
      requestAnimationFrame(frame);
      addEventListener('resize', resize, { once: true });
    }

    /* 🎊 Lluvia de confeti: cae desde arriba, mucha cantidad y piezas grandes */
function confettiRain({
  x0 = 0,                 // desde qué X (viewport)
  x1 = innerWidth,        // hasta qué X (viewport)
  y0 = -40,               // arranque por encima del viewport
  count = 900,            // MUCHO confeti
  sizeMin = 10,           // piezas grandes
  sizeMax = 24,
  gravity = 0.45,         // caída rápida
  wind = 0.9,             // deriva horizontal
  decay = 0.996           // vida de las piezas
} = {}) {
  const c = document.createElement('canvas');
  Object.assign(c.style, {
    position: 'fixed', inset: '0', pointerEvents: 'none', zIndex: 9999
  });
  document.body.appendChild(c);
  const g = c.getContext('2d');

  const resize = () => { c.width = innerWidth; c.height = innerHeight; };
  resize();

  const colors = ['#ffcb05','#2a75bb','#f59e0b','#10b981','#ef4444','#a855f7','#3b82f6','#fb7185'];
  const toRad = Math.PI/180;

  const parts = Array.from({ length: count }, () => {
    const w = sizeMin + Math.random()*(sizeMax - sizeMin);
    return {
      x: x0 + Math.random()*(x1 - x0),
      y: y0 - Math.random()*120,
      vx: (Math.random()*2 - 1) * wind,   // deriva a izquierda/derecha
      vy: 2 + Math.random()*3,
      size: w,
      rot: Math.random()*360,
      rotSpd: (Math.random()*8 - 4),
      color: colors[(Math.random()*colors.length)|0],
      alpha: 1
    };
  });

  function frame() {
    g.clearRect(0,0,c.width,c.height);
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.vy += gravity * 0.5;
      p.x  += p.vx + Math.sin((p.y + p.rot) * 0.02) * 0.6; // leve serpenteo
      p.y  += p.vy;
      p.rot += p.rotSpd;
      p.alpha *= decay;

      if (p.y > c.height + 40 || p.alpha < 0.03) { parts.splice(i,1); continue; }

      g.save();
      g.globalAlpha = p.alpha;
      g.translate(p.x, p.y);
      g.rotate(p.rot * toRad);
      g.fillStyle = p.color;
      // rectángulos “papelitos”
      g.fillRect(-p.size/2, -p.size/2, p.size, p.size*0.55);
      g.restore();
    }
    if (parts.length) requestAnimationFrame(frame);
    else c.remove();
  }
  requestAnimationFrame(frame);
  addEventListener('resize', resize, { once: true });
}

    /* Ruleta */
    let wheelRotation=0, spinning=false;
    function randColor(i,n){ const h=Math.floor((360/n)*i); return `hsl(${h} 70% 45%)`; }
    function drawWheel(){
      const names=getActivePlayers(); const W=wheelCanvas.width,H=wheelCanvas.height;
      const cx=W/2, cy=H/2, r=Math.min(W,H)/2-10;
      ctx.clearRect(0,0,W,H); ctx.save(); ctx.translate(cx,cy); ctx.rotate(wheelRotation);
      if(!names.length){ ctx.fillStyle='#e5e7eb'; ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#6b7280'; ctx.font='16px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('Sin participantes',0,0); ctx.restore(); return; }
      const arc=(Math.PI*2)/names.length;
      for(let i=0;i<names.length;i++){
        ctx.beginPath(); ctx.moveTo(0,0); ctx.fillStyle=randColor(i,names.length); ctx.arc(0,0,r,i*arc,(i+1)*arc); ctx.closePath(); ctx.fill();
        ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
        ctx.save(); ctx.rotate(i*arc+arc/2); ctx.translate(r*.7,0); ctx.rotate(Math.PI/2);
        ctx.fillStyle='rgba(255,255,255,.92)'; ctx.fillRect(-r*.26,-14,r*.52,28);
        ctx.fillStyle='#111827'; ctx.font='14px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
        const label=names[i].length>18?names[i].slice(0,18)+'…':names[i]; ctx.fillText(label,0,0); ctx.restore();
      }
      ctx.beginPath(); ctx.fillStyle='white'; ctx.arc(0,0,42,0,Math.PI*2); ctx.fill(); ctx.strokeStyle='#e5e7eb'; ctx.lineWidth=4; ctx.stroke(); ctx.restore();
    }
    function spin(){
      const names=getActivePlayers(); if(spinning) return; if(names.length<2){ flash('Necesitas al menos 2 activos para girar.'); return; }
      spinning=true; const duration=4000+Math.random()*3000, start=performance.now();
      const startRot=wheelRotation, extra=8+Math.random()*6, finalRot=startRot+extra*2*Math.PI+Math.random()*2*Math.PI;
      const ease=t=>1-Math.pow(1-t,3);
      function frame(now){ const t=Math.min(1,(now-start)/duration); wheelRotation=startRot+(finalRot-startRot)*ease(t); drawWheel(); if(t<1) requestAnimationFrame(frame); else{ spinning=false; announceWinner(); } }
      requestAnimationFrame(frame);
    }
    function announceWinner(){
      const names=getActivePlayers(); const arc=(Math.PI*2)/names.length;
      const normalized=(2*Math.PI-(wheelRotation%(2*Math.PI)))%(2*Math.PI);
      let idx=Math.floor(normalized/arc); if(idx<0) idx=0; if(idx>=names.length) idx=names.length-1;
      const picked=names[idx]; recent.unshift(picked); if(recent.length>8) recent.pop();
      recentTags.innerHTML='';
      recent.forEach(n=>{
        const s=document.createElement('span');
        s.className='px-2 py-0.5 rounded-lg bg-gray-100 border border-gray-300 text-gray-700 text-sm';
        s.textContent=n; recentTags.appendChild(s);
      });
      flash('Seleccionado: '+picked);

      // 🎊 Confeti a la derecha del canvas (como tu UI indica)
      const r = wheelCanvas.getBoundingClientRect();
      confettiBurst({
        x: r.right - 8,
        y: r.top + r.height / 2,
        particles: 160,
        spread: 120,
        scalar: 1.1
      });
    }

    /* Bracket */
    let bracketRounds=[]; // [{p1,p2,winner,code}]
    let editMode=false;
    let animateNextDraw=false;

    function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
    function nextPow2(n){ return Math.pow(2, Math.ceil(Math.log2(n))); }
    function codeFor(roundIdx, matchIdx, totalRounds){
      if(roundIdx===0) return 'M'+(matchIdx+1);
      if(roundIdx===totalRounds-2) return 'SF'+(matchIdx+1);
      if(roundIdx===totalRounds-1) return 'F';
      return `R${roundIdx+1}-${matchIdx+1}`;
    }

    function generateBracket(){
      const names=getActivePlayers();
      if(names.length<2){ flash('Se requieren al menos 2 activos.'); return; }
      if(names.length>32){ flash('Máximo 32 participantes.'); return; }

      const P=nextPow2(names.length);
      const entries=names.slice();
      for(let i=0;i<P-names.length;i++) entries.push('BYE');
      shuffle(entries);

      const r1=[];
      for(let i=0;i<entries.length;i+=2) r1.push({p1:entries[i], p2:entries[i+1], winner:null});
      bracketRounds=[r1];

      let m=r1.length;
      while(m>1){ m=Math.floor(m/2); bracketRounds.push(Array.from({length:m},()=>({p1:null,p2:null,winner:null}))); }

      for(let r=0;r<bracketRounds.length;r++)
        for(let i=0;i<bracketRounds[r].length;i++)
          bracketRounds[r][i].code = codeFor(r,i,bracketRounds.length);

      autoAdvanceByes(0);
      renderBracket();
      championBox.innerHTML='';
      animateNextDraw=true;
    }

    function autoAdvanceByes(rIdx){
      const round=bracketRounds[rIdx];
      for(let i=0;i<round.length;i++){
        const m=round[i];
        const hasBye=(m.p1==='BYE'&&m.p2!=='BYE')||(m.p2==='BYE'&&m.p1!=='BYE');
        if(hasBye){ m.winner = m.p1==='BYE'? m.p2 : m.p1; placeWinner(rIdx,i,m.winner); }
        else if(m.p1==='BYE'&&m.p2==='BYE'){ m.winner='BYE'; placeWinner(rIdx,i,m.winner); }
      }
    }

    function placeWinner(rIdx, mIdx, name){
      const next=bracketRounds[rIdx+1]; if(!next) return;
      const target=Math.floor(mIdx/2);
      if(mIdx%2===0) next[target].p1=name; else next[target].p2=name;

      const m=next[target];
      if(m.p1 && m.p2){
        const bye=(m.p1==='BYE'&&m.p2!=='BYE')||(m.p2==='BYE'&&m.p1!=='BYE');
        if(bye){ m.winner = m.p1==='BYE'? m.p2 : m.p1; placeWinner(rIdx+1,target,m.winner); }
        else if(m.p1==='BYE'&&m.p2==='BYE'){ m.winner='BYE'; placeWinner(rIdx+1,target,m.winner); }
      }
    }

    function renderBracket(){
      bracketCols.innerHTML='';
      if(!bracketRounds.length){ bracketLines.innerHTML=''; return; }

      bracketRounds.forEach((round,rIdx)=>{
        const col=document.createElement('div'); col.className='bracket-col'; col.id=`tr_col-r${rIdx}`;
        const title=document.createElement('div'); title.className='col-title font-bold text-gray-800 mb-1';
        title.textContent=(rIdx===bracketRounds.length-1)?'Final':(rIdx===bracketRounds.length-2?'Semifinales':(rIdx===0?'Ronda 1':`Ronda ${rIdx+1}`));
        col.appendChild(title);

        round.forEach((m,mIdx)=>{
          const match=document.createElement('div'); match.className='match'; match.id=`tr_match-r${rIdx}-m${mIdx}`;
          const top = slotEl(rIdx,mIdx,'p1', m.p1, m.winner===m.p1);
          const bot = slotEl(rIdx,mIdx,'p2', m.p2, m.winner===m.p2);
          match.appendChild(top); match.appendChild(bot);
          col.appendChild(match);
        });

        bracketCols.appendChild(col);
      });

      alignMatchesToMidpoints();
      updateChampion();
      window.requestAnimationFrame(drawConnections);
    }

    function alignMatchesToMidpoints(){
      if(!bracketRounds.length) return;
      const first = document.getElementById('tr_col-r0');
      const firstH = first ? first.getBoundingClientRect().height : 0;

      for(let r=0;r<bracketRounds.length;r++){
        const col = document.getElementById(`tr_col-r${r}`);
        col.style.position='relative';
        if(firstH) col.style.minHeight = firstH + 'px';

        bracketRounds[r].forEach((_,i)=>{
          const el = document.getElementById(`tr_match-r${r}-m${i}`);
          if(r===0){ el.style.position='static'; el.style.top=''; }
          else{ el.style.position='absolute'; el.style.left='0'; el.style.right='0'; }
        });

        if(r===0) continue;

        const colRect = document.getElementById(`tr_col-r${r}`).getBoundingClientRect();
        for(let i=0;i<bracketRounds[r].length;i++){
          const srcA = document.getElementById(`tr_match-r${r-1}-m${i*2}`);
          const srcB = document.getElementById(`tr_match-r${r-1}-m${i*2+1}`);
          const dst  = document.getElementById(`tr_match-r${r}-m${i}`);
          if(!(srcA && srcB && dst)) continue;

          const a = srcA.getBoundingClientRect();
          const b = srcB.getBoundingClientRect();
          const midY = ((a.top + a.height/2) + (b.top + b.height/2)) / 2;

          const top = midY - colRect.top - (dst.offsetHeight/2);
          dst.style.top = `${top}px`;
        }
      }
    }

    function slotEl(rIdx,mIdx,which,value,isWinner){

      if(editMode && rIdx===0){
        const wrap=document.createElement('div'); wrap.className='slot select'; wrap.id=id;
        const sel=document.createElement('select'); sel.className='w-full rounded-lg border border-gray-300 bg-white px-2 py-2 focus:outline-none focus:ring-2 focus:ring-[#2a75bb]';
        const opts=['','BYE',...getActivePlayers()];
        opts.forEach(v=>{ const o=document.createElement('option'); o.value=v; o.textContent=v||'— vacío —'; if(v===value) o.selected=true; sel.appendChild(o); });
        sel.addEventListener('change', ()=> setSlotR1(mIdx, which, sel.value || null));
        wrap.appendChild(sel); return wrap;
      }

      const btn=document.createElement('button'); btn.className='slot'; btn.id=id;
      if(value==null && rIdx>0){ btn.textContent=''; btn.disabled=true; btn.classList.add('pending'); }
      else{ btn.textContent=value ?? '¿Pendiente?'; }
      if(value==='BYE'){ btn.classList.add('bye'); btn.disabled=true; }
      if(isWinner) btn.classList.add('winner');

      if(value && value!=='BYE'){
        btn.addEventListener('click', ()=>{
          const m = bracketRounds[rIdx][mIdx];
          m.winner = (which==='p1') ? m.p1 : m.p2;
          placeWinner(rIdx,mIdx,m.winner);
          renderBracket();
        });
      }
      return btn;
    }

    function setSlotR1(mIdx, which, val){
      const m = bracketRounds[0][mIdx];
      m[which] = val || null;
      m.winner = null;
      for(let r=1;r<bracketRounds.length;r++)
        bracketRounds[r].forEach(mm=>{ mm.p1=null; mm.p2=null; mm.winner=null; });
      autoAdvanceByes(0);
      renderBracket();
      championBox.innerHTML='';
    }

  function updateChampion(){
  const last = bracketRounds[bracketRounds.length - 1];
  if(!last) return;
  const f = last[0];
  const hasChamp = (f && f.winner && f.winner !== 'BYE');

  championBox.innerHTML = hasChamp
    ? `<div class="mt-2 inline-flex items-center gap-2 px-3 py-2 rounded-xl bg-white border border-green-200 text-green-700">
         🏆 <span><b>Campeón:</b> ${escapeHtml(f.winner)}</span>
       </div>`
    : '';

  if (hasChamp) {
    // 📍 área del cartel de campeón (llueve por encima de esa zona)
    const box = championBox.getBoundingClientRect();

    // Oleada 1: muy densa y piezas grandes
    confettiRain({
      x0: Math.max(0, box.left - 80),
      x1: Math.min(innerWidth, box.right + 80),
      y0: -40,
      count: 950,
      sizeMin: 12,
      sizeMax: 26,
      gravity: 0.48,
      wind: 1.0,
      decay: 0.996
    });

    // Oleada 2 (ligero retardo): refuerzo para que “llueva más”
    setTimeout(() => {
      confettiRain({
        x0: Math.max(0, box.left - 140),
        x1: Math.min(innerWidth, box.right + 140),
        y0: -60,
        count: 700,
        sizeMin: 10,
        sizeMax: 22,
        gravity: 0.46,
        wind: 0.9,
        decay: 0.997
      });
    }, 260);
  }
}



    function drawConnections(){
      bracketLines.innerHTML='';
      const colsCount = bracketRounds.length;
      if(colsCount<2) return;

      const wrapRect = bracketScroll.getBoundingClientRect();

      for(let r=0;r<colsCount-1;r++){
        bracketRounds[r].forEach((match, i)=>{
          const src = document.getElementById(`tr_match-r${r}-m${i}`);
          const dstMatchIdx = Math.floor(i/2);
          const dst = document.getElementById(`tr_match-r${r+1}-m${dstMatchIdx}`);
          if(!src || !dst) return;

          const sA = src.getBoundingClientRect();
          const mateIdx = (i%2===0)? i+1 : i-1;
          const mate = document.getElementById(`tr_match-r${r}-m${mateIdx}`);
          const sB = (mate? mate.getBoundingClientRect() : sA);

          const dstSlotId = `tr_slot-r${r+1}-m${dstMatchIdx}-${(i%2===0)?'p1':'p2'}`;
          const dSlot = document.getElementById(dstSlotId);
          const d = (dSlot || dst).getBoundingClientRect();

          const x1 = sA.right - wrapRect.left;
          const y1 = sA.top + sA.height/2 - wrapRect.top;
          const x2 = d.left - wrapRect.left;
          const y2 = d.top + d.height/2 - wrapRect.top;
          const pad = Math.min(52, Math.abs(x2-x1)/2.5);

          const path = document.createElementNS('http://www.w3.org/2000/svg','path');
          path.setAttribute('d', `M ${x1} ${y1} H ${x1+pad} V ${y2} H ${x2}`);
          path.setAttribute('class', 'wire' + ((match.winner && match.winner!=='BYE') ? ' won' : ''));
          bracketLines.appendChild(path);

          const idealY = ((sA.top + sA.height/2) + (sB.top + sB.height/2))/2 - wrapRect.top;
          const elbowX = x1 + pad;
          const hasWinner = !!(match.winner && match.winner!=='BYE');
          const cap = document.createElementNS('http://www.w3.org/2000/svg','path');
          cap.setAttribute('d', hasWinner ? `M ${elbowX} ${idealY} H ${elbowX-14}` : `M ${elbowX} ${idealY} H ${elbowX+14}`);
          cap.setAttribute('class', 'wire wire-cap' + (hasWinner ? ' won' : ''));
          bracketLines.appendChild(cap);
        });
      }
      animateNextDraw=false;
    }

    function updateFades(){
      const left = document.querySelector('#tr_torneo .fade-left');
      const right = document.querySelector('#tr_torneo .fade-right');
      const max = bracketScroll.scrollWidth - bracketScroll.clientWidth;
      if(max <= 2){ left.style.opacity=0; right.style.opacity=0; return; }
      const atStart = bracketScroll.scrollLeft <= 2;
      const atEnd = bracketScroll.scrollLeft >= max-2;
      left.style.opacity = atStart ? 0 : 1;
      right.style.opacity = atEnd ? 0 : 1;
    }

    // Eventos
    const onResize = ()=>{ alignMatchesToMidpoints(); drawConnections(); drawWheel(); updateFades(); };
    const onScroll = ()=>{ drawConnections(); updateFades(); };
    window.addEventListener('resize', onResize);
    bracketScroll.addEventListener('scroll', onScroll);

    const onGen = ()=>{ generateBracket(); flash('Cuadro generado.'); updateFades(); };
    const onResetBracket = ()=>{ bracketRounds=[]; bracketCols.innerHTML=''; bracketLines.innerHTML=''; championBox.innerHTML=''; updateFades(); };
    const onEditToggle = ()=>{ editMode = editModeChk.checked; renderBracket(); };
    const onSpin = ()=> spin();
    const onAddClick = ()=> onAdd();
    const onAddEnter = e=>{ if(e.key==='Enter') onAdd(); };
    const onResetPeople = ()=>{ players=DEFAULT_PLAYERS.slice(); savePlayers(); refreshPeople(); drawWheel(); flash('Participantes restaurados.'); };
    const onClearPeople = ()=>{ players=[]; savePlayers(); refreshPeople(); drawWheel(); };

    genBracketBtn.addEventListener('click', onGen);
    resetBracketBtn.addEventListener('click', onResetBracket);
    editModeChk.addEventListener('change', onEditToggle);
    spinBtn.addEventListener('click', onSpin);
    addBtn.addEventListener('click', onAddClick);
    newNameEl.addEventListener('keyup', onAddEnter);
    resetBtn.addEventListener('click', onResetPeople);
    clearBtn.addEventListener('click', onClearPeople);

    function escapeHtml(s){ return s ? s.replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#039;'}[m])) : ''; }

    // Init
    function init(){ refreshPeople(); drawWheel(); updateFades(); }
    init();

    // Cleanup al desmontar la ruta
    return () => {
      window.removeEventListener('resize', onResize);
      bracketScroll.removeEventListener('scroll', onScroll);
      genBracketBtn.removeEventListener('click', onGen);
      resetBracketBtn.removeEventListener('click', onResetBracket);
      editModeChk.removeEventListener('change', onEditToggle);
      spinBtn.removeEventListener('click', onSpin);
      addBtn.removeEventListener('click', onAddClick);
      newNameEl.removeEventListener('keyup', onAddEnter);
      resetBtn.removeEventListener('click', onResetPeople);
      clearBtn.removeEventListener('click', onClearPeople);
    };
  }, []);

  return (
    <div id="tr_torneo" className="torneo-root">
      <main className="space-y-8">
        {/* Controles + Bracket */}
        <section className="space-y-2">
          <div className="flex flex-wrap items-end justify-between gap-3">
            <h2 className="font-extrabold text-lg">Mapa de rondas</h2>
            <div className="flex items-center gap-2">
              <button id="tr_genBracketBtn" className="px-4 py-2 rounded-xl bg-[#2a75bb] text-white hover:opacity-90">Aleatorio</button>
              <button id="tr_resetBracketBtn" className="px-4 py-2 rounded-xl border border-gray-300 hover:bg-gray-50 text-gray-800">Limpiar</button>
              <label className="ml-1 inline-flex items-center gap-2 text-sm text-gray-700 select-none">
                <input id="tr_editModeChk" type="checkbox" className="h-4 w-4 rounded border-gray-300 text-[#2a75bb] focus:ring-[#2a75bb]" />
                Modo manual
              </label>
            </div>
          </div>
          <p className="text-gray-500 text-sm">Clic en un slot para marcar ganador. BYEs automáticos.</p>

          <div className="bracket-wrap">
            <div className="fade-edge fade-left" aria-hidden="true"></div>
            <div className="fade-edge fade-right" aria-hidden="true"></div>
            <svg className="tr_bracketLines" id="tr_bracketLines" aria-hidden="true"></svg>
            <div id="tr_bracketScroll" className="bracket-scroll">
              <div id="tr_bracketCols" className="flex gap-6"></div>
            </div>
          </div>

          <div id="tr_championBox" className="text-green-700 font-semibold"></div>
        </section>

        {/* Participantes + Ruleta */}
        <section className="grid grid-cols-1 lg:grid-cols-2 gap-6">
          {/* Participantes */}
          <div className="bg-white rounded-2xl border border-gray-200 p-4">
            <div className="flex items-center justify-between">
              <h3 className="font-semibold">Participantes</h3>
              <div className="text-gray-500 text-sm">Activos: <b id="tr_activeCount">0</b></div>
            </div>

            <div className="flex gap-2 my-3">
              <input id="tr_newName" type="text" placeholder="Añadir participante" className="flex-1 rounded-xl border border-gray-300 bg-white px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#2a75bb]" />
              <button id="tr_addBtn" className="px-4 py-2 rounded-xl bg-[#2a75bb] text-white hover:opacity-90">Añadir</button>
            </div>

            <div className="flex flex-wrap gap-2 mb-3">
              <button id="tr_resetBtn" className="px-3 py-1.5 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-50 text-sm">Restaurar 6 iniciales</button>
              <button id="tr_clearBtn" className="px-3 py-1.5 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-50 text-sm">Vaciar</button>
            </div>

            <div id="tr_chipZone" className="flex flex-wrap gap-2 mb-3"></div>
            <div id="tr_nameList" className="space-y-2"></div>
          </div>

          {/* Ruleta */}
          <div className="bg-white rounded-2xl border border-gray-200 p-4">
            <h3 className="font-semibold">Ruleta aleatoria</h3>
            <div className="relative flex justify-center my-3">
              <canvas id="tr_wheel" width="420" height="420"></canvas>
            </div>
            <div className="grid gap-2">
              <button id="tr_spinBtn" className="px-4 py-2 rounded-xl bg-[#2a75bb] text-white hover:opacity-90">Girar</button>
              <p className="text-gray-500 text-sm">A la derecha será el ganador.</p>
            </div>
            <hr className="my-3 border-gray-200" />
            <p className="text-gray-500 text-sm mb-1">Elegidos recientes:</p>
            <div id="tr_recentTags" className="flex flex-wrap gap-2"></div>
          </div>
        </section>
      </main>

      {/* Toast */}
      <div id="tr_toast" className="fixed top-4 left-1/2 -translate-x-1/2 hidden">
        <div className="bubble px-4 py-2 rounded-xl bg-gray-900 text-white shadow-xl text-sm" id="tr_toastBody">Hecho</div>
      </div>
    </div>
  );
}


    /* -------------------- Mount -------------------- */
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
